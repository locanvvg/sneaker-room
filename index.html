<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sneaker Museum Catalog</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .sneaker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }
    .sneaker-card {
      background: #161616;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 15px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s;
    }
    .sneaker-card:hover {
      transform: translateY(-3px);
      border-color: #444;
    }
    .sneaker-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .sneaker-card h3 {
      font-size: 1rem;
      color: #fff;
      margin-bottom: 4px;
    }
    .sneaker-card p {
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>DIGITAL EXHIBITION CATALOG</h1>
      <p>Bảo tàng lưu trữ bộ sưu tập cá nhân</p>
    </header>

    <main>
      <div id="sneaker-list" class="sneaker-grid"></div>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    const listContainer = document.getElementById('sneaker-list');
    sneakers.forEach(shoe => {
      const card = document.createElement('a');
      card.className = 'sneaker-card';
      card.href = `shoe.html?id=${shoe.id}`;
      card.innerHTML = `
        <img src="${shoe.image}" alt="${shoe.title}">
        <h3>${shoe.title}</h3>
        <p>${shoe.subtitle}</p>
      `;
      listContainer.appendChild(card);
    });
  </script>
</body>
</html>
