<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lộc An Sneaker Collection</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .sneaker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .sneaker-card {
      background: #141414;
      border: 1px solid #262626;
      border-radius: 12px;
      padding: 16px;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    .sneaker-card:hover {
      transform: translateY(-4px);
      border-color: #555;
      background: #1a1a1a;
    }
    .sneaker-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 14px;
    }
    .sneaker-card h3 {
      font-size: 1.05rem;
      color: #fff;
      margin: 0 0 6px 0;
      line-height: 1.3;
    }
    .sneaker-card p {
      font-size: 0.85rem;
      color: #888;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>LỘC AN SNEAKER COLLECTION</h1>
      <p>Bảo tàng & Không gian lưu trữ bộ sưu tập cá nhân</p>
    </header>

    <main>
      <div id="sneaker-list" class="sneaker-grid"></div>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    const listContainer = document.getElementById('sneaker-list');
    if (typeof sneakers !== 'undefined' && sneakers.length > 0) {
      sneakers.forEach(shoe => {
        const card = document.createElement('a');
        card.className = 'sneaker-card';
        card.href = `shoe.html?id=${shoe.id}`;
        card.innerHTML = `
          <img src="${shoe.image}" alt="${shoe.title}">
          <h3>${shoe.title}</h3>
          <p>${shoe.subtitle}</p>
        `;
        listContainer.appendChild(card);
      });
    }
  </script>
</body>
</html>
