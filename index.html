            type="button"
            id="btn-en"
            class="lang-btn"
            onclick="setLanguage('en')"

            EN

      <h1 data-i18n="mainTitle">

      <nav

    <!-- =====================================================
         SEARCH
    ====================================================== -->

    <section class="archive-search-panel">

      <label
        id="archive-search-label"
        for="archive-search-input"
        class="archive-search-label"
      >
        TÌM KIẾM
      </label>


      <div class="archive-search-box">

        <span
          class="archive-search-icon"
          aria-hidden="true"
        >
          ⌕
        </span>


        <input
          id="archive-search-input"
          class="archive-search-input"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Tìm kiếm..."
          aria-label="Tìm kiếm bộ sưu tập"
          oninput="handleArchiveSearch(this.value)"
          onkeydown="handleArchiveSearchKeydown(event)"
        >


        <button
          type="button"
          id="archive-search-clear"
          class="archive-search-clear"
          aria-label="Xóa tìm kiếm"
          onclick="clearArchiveSearch()"
        >
          ×
        </button>

      </div>

    </section>


    <!-- =====================================================
         SORT
    ====================================================== -->

    <section class="collection-toolbar">

      <div class="sort-control">

        <label
          for="sort-select"
          id="sort-label"
        >
          SẮP XẾP
        </label>


        <select
          id="sort-select"
          onchange="changeSort(this.value)"
        >

          <option value="default">
            Mặc định
          </option>

          <option value="az">
            A → Z
          </option>

          <option value="za">
            Z → A
          </option>

          <option value="date-desc">
            Ngày phát hành: Mới → Cũ
          </option>

          <option value="date-asc">
            Ngày phát hành: Cũ → Mới
          </option>

          <option value="size-asc">
            Size nhỏ → lớn
          </option>

          <option value="size-desc">
            Size lớn → nhỏ
          </option>

        </select>

      </div>

    </section>


    <!-- =====================================================
         FILTERS
    ====================================================== -->

    <section class="filter-panel">

      <div class="filter-panel-header">

        <span
          class="filter-main-label"
          id="filter-title"
        >
          BỘ LỌC BỘ SƯU TẬP
        </span>


        <button
          type="button"
          id="clear-filters"
          class="clear-filter-btn"
          onclick="clearAllFilters()"
        >
          XÓA BỘ LỌC
        </button>

      </div>


      <!-- EDITION -->

      <div class="filter-group">

        <div
          id="edition-filter-label"
          class="filter-group-label"
        >
          PHÂN KHÚC
        </div>


        <div class="filter-chips">

          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="PE"
            onclick="toggleFilter('edition', 'PE')"
          >
            PE
          </button>


          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="Sample"
            onclick="toggleFilter('edition', 'Sample')"
          >
            SAMPLE
          </button>


          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="F&F"
            onclick="toggleFilter('edition', 'F&F')"
          >
            F&amp;F
          </button>


          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="Signature Signed"
            onclick="toggleFilter('edition', 'Signature Signed')"
          >
            SIGNATURE SIGNED
          </button>


          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="GR"
            onclick="toggleFilter('edition', 'GR')"
          >
            GR
          </button>

        </div>

      </div>


      <!-- CONDITION -->

      <div class="filter-group">

        <div
          id="condition-filter-label"
          class="filter-group-label"
        >
          TÌNH TRẠNG
        </div>


        <div class="filter-chips">

          <button
            type="button"
            class="filter-chip"
            data-group="condition"
            data-value="Deadstock"
            onclick="toggleFilter('condition', 'Deadstock')"
          >
            DEADSTOCK
          </button>


          <button
            type="button"
            class="filter-chip"
            data-group="condition"
            data-value="Used"
            onclick="toggleFilter('condition', 'Used')"
          >
            USED
          </button>

        </div>

      </div>


      <!-- SIZE -->

      <div class="filter-group">

        <div
          id="size-filter-label"
          class="filter-group-label"
        >
          KÍCH CỠ
        </div>


        <div
          id="size-filter-chips"
          class="filter-chips"
        ></div>

      </div>

    </section>


    <!-- =====================================================
         RESULT COUNT
    ====================================================== -->

    <div
      id="collection-count"
      class="collection-count"
    >
      TỔNG SỐ: 0 ĐÔI
    </div>


    <!-- =====================================================
         GRID
    ====================================================== -->

    <main>

      <div
        id="sneaker-grid"
        class="grid"
      ></div>

    </main>


    <footer>

      <p>
        &copy; 2026 Lộc An Sneaker Collection.
        All Rights Reserved.
      </p>

    </footer>

  </div>


  <!-- =====================================================
       DATA + EXISTING WEBSITE LOGIC
  ====================================================== -->

  <script
    src="./data.js?v=20260912-final-search"
  ></script>

  <script
    src="./main.js?v=20260912-final-search"
  ></script>


  <!-- =====================================================
       SEARCH EXTENSION

       Không thay main.js.
       Search được nối vào filter hiện tại.
  ====================================================== -->

  <script>

    let archiveSearchQuery = "";


    /* =====================================================
       TEXT NORMALIZATION
    ====================================================== */

    function normalizeArchiveSearchText(value) {

      return String(value ?? "")

        .normalize("NFD")

        .replace(
          /[\u0300-\u036f]/g,
          ""
        )

        .toLowerCase()

        .trim();

    }


    function flattenArchiveSearchValue(value) {

      if (
        value === null
        ||
        value === undefined
      ) {
        return "";
      }


      if (
        typeof value === "string"
        ||
        typeof value === "number"
      ) {

        return String(value);

      }


      if (
        Array.isArray(value)
      ) {

        return value
          .map(
            flattenArchiveSearchValue
          )
          .join(" ");

      }


      if (
        typeof value === "object"
      ) {

        return Object
          .values(value)
          .map(
            flattenArchiveSearchValue
          )
          .join(" ");

      }


      return "";

    }


    /* =====================================================
       BUILD SEARCHABLE TEXT FOR EACH SNEAKER
    ====================================================== */

    function getSneakerArchiveSearchText(sneaker) {

      const searchableFields = [

        sneaker.title,

        sneaker.subtitle,

        sneaker.brand,

        sneaker.collaboration,

        sneaker.sku,

        sneaker.styleCode,

        sneaker.colorway,

        sneaker.editionType,

        sneaker.condition,

        sneaker.size,

        sneaker.releaseDate,

        sneaker.retail,

        sneaker.retailPrice

      ];


      return normalizeArchiveSearchText(

        searchableFields

          .map(
            flattenArchiveSearchValue
          )

          .join(" ")

      );

    }


    /* =====================================================
       EXTEND EXISTING FILTER FUNCTION
    ====================================================== */

    const originalFilterSneakers =
      filterSneakers;


    filterSneakers =
      function (items) {

        /*
          First run all existing filters:
          Edition / Condition / Size
        */

        const filteredByExistingFilters =
          originalFilterSneakers(
            items
          );


        const query =
          normalizeArchiveSearchText(
            archiveSearchQuery
          );


        /*
          Empty search:
          return the normal filter results.
        */

        if (!query) {

          return filteredByExistingFilters;

        }


        /*
          Multiple words all have to match.

          Example:
          "jordan sample"
          requires both "jordan" and "sample".
        */

        const searchTerms =
          query

            .split(/\s+/)

            .filter(Boolean);


        return filteredByExistingFilters.filter(
          sneaker => {

            const searchableText =
              getSneakerArchiveSearchText(
                sneaker
              );


            return searchTerms.every(
              term =>
                searchableText.includes(
                  term
                )
            );

          }
        );

      };


    /* =====================================================
       SEARCH EVENTS
    ====================================================== */

    let archiveSearchTimer = null;


    function handleArchiveSearch(value) {

      archiveSearchQuery =
        value;


      updateArchiveSearchUI();


      /*
        Very small debounce so searching remains smooth
        when the collection grows to ~200 pairs.
      */

      clearTimeout(
        archiveSearchTimer
      );


      archiveSearchTimer =
        setTimeout(
          () => {

            renderGrid();

          },
          70
        );

    }


    function clearArchiveSearch() {

      archiveSearchQuery =
        "";


      clearTimeout(
        archiveSearchTimer
      );


      const input =
        document.getElementById(
          "archive-search-input"
        );


      if (input) {

        input.value =
          "";

        input.focus();

      }


      updateArchiveSearchUI();

      renderGrid();

    }


    function handleArchiveSearchKeydown(event) {

      if (
        event.key === "Escape"
      ) {

        clearArchiveSearch();

      }

    }


    function updateArchiveSearchUI() {

      const clearButton =
        document.getElementById(
          "archive-search-clear"
        );


      if (!clearButton) {
        return;
      }


      clearButton.classList.toggle(

        "visible",

        archiveSearchQuery
          .trim()
          .length > 0

      );

    }


    /* =====================================================
       VI / EN
    ====================================================== */

    const originalUpdateStaticText =
      updateStaticText;


    updateStaticText =
      function () {

        /*
          Preserve all existing translations.
        */

        originalUpdateStaticText();


        const label =
          document.getElementById(
            "archive-search-label"
          );


        const input =
          document.getElementById(
            "archive-search-input"
          );


        const clearButton =
          document.getElementById(
            "archive-search-clear"
          );


        if (
          currentLang === "vi"
        ) {

          if (label) {

            label.textContent =
              "TÌM KIẾM";

          }


          if (input) {

            input.placeholder =
              "Tìm kiếm...";

            input.setAttribute(
              "aria-label",
              "Tìm kiếm bộ sưu tập"
            );

          }


          if (clearButton) {

            clearButton.setAttribute(
              "aria-label",
              "Xóa tìm kiếm"
            );

          }

        } else {

          if (label) {

            label.textContent =
              "SEARCH";

          }


          if (input) {

            input.placeholder =
              "Search...";

            input.setAttribute(
              "aria-label",
              "Search collection"
            );

          }


          if (clearButton) {

            clearButton.setAttribute(
              "aria-label",
              "Clear search"
            );

          }

        }

      };


    /* =====================================================
       RESULT COUNTER
    ====================================================== */

    const originalUpdateCollectionCount =
      updateCollectionCount;


    updateCollectionCount =
      function (count) {

        const element =
          document.getElementById(
            "collection-count"
          );


        if (
          !element
          ||
          typeof sneakers === "undefined"
          ||
          !Array.isArray(sneakers)
        ) {

          originalUpdateCollectionCount(
            count
          );

          return;

        }


        const total =
          sneakers.length;


        const searchIsActive =
          archiveSearchQuery
            .trim()
            .length > 0;


        const filtersAreActive =

          activeFilters.edition.size > 0

          ||

          activeFilters.condition.size > 0

          ||

          activeFilters.size.size > 0;


        if (
          searchIsActive
          ||
          filtersAreActive
        ) {

          element.textContent =

            currentLang === "vi"

              ? `HIỂN THỊ: ${count} / ${total} ĐÔI`

              : `SHOWING: ${count} / ${total} PAIRS`;

          return;

        }


        originalUpdateCollectionCount(
          count
        );

      };


    /* =====================================================
       INIT
    ====================================================== */

        document.addEventListener(
      "DOMContentLoaded",
      () => {

        updateArchiveSearchUI();

      }
    );

  </script>


  <!-- =====================================================
       COLLECTION VIEW CONTROLLER
       Adjustable Grid + 3D Cover Flow
  ====================================================== -->

 


</body>
