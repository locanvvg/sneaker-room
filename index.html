  ====================================================== -->

  <script>

    let archiveSearchQuery = "";


    /* =====================================================
       TEXT NORMALIZATION
    ====================================================== */

    function normalizeArchiveSearchText(value) {

      return String(value ?? "")

        .normalize("NFD")

        .replace(
          /[\u0300-\u036f]/g,
          ""
        )

        .toLowerCase()

        .trim();

    }


    /* =====================================================
       FLATTEN VALUES
    ====================================================== */

    function flattenArchiveSearchValue(value) {

      if (
        value === null
        ||
        value === undefined
      ) {

        return "";

      }


      if (
        typeof value === "string"
        ||
        typeof value === "number"
      ) {

        return String(value);

      }


      if (
        Array.isArray(value)
      ) {

        return value

          .map(
            flattenArchiveSearchValue
          )

          .join(" ");

      }


      if (
        typeof value === "object"
      ) {

        return Object

          .values(value)

          .map(
            flattenArchiveSearchValue
          )

          .join(" ");

      }


      return "";

    }


    /* =====================================================
       BUILD SEARCHABLE TEXT FOR EACH SNEAKER
    ====================================================== */

    function getSneakerArchiveSearchText(sneaker) {

      const searchableFields = [

        sneaker.title,

        sneaker.subtitle,

        sneaker.brand,

        sneaker.collaboration,

        sneaker.sku,

        sneaker.styleCode,

        sneaker.colorway,

        sneaker.editionType,

        sneaker.condition,

        sneaker.size,

        sneaker.releaseDate,

        sneaker.retail,

        sneaker.retailPrice

      ];


      return normalizeArchiveSearchText(

        searchableFields

          .map(
            flattenArchiveSearchValue
          )

          .join(" ")

      );

    }


    /* =====================================================
       EXTEND EXISTING FILTER FUNCTION
    ====================================================== */

    const originalFilterSneakers =
      filterSneakers;


    filterSneakers =
      function (items) {


        /*
          First run all existing filters:

          - Edition
          - Condition
          - Size
        */

        const filteredByExistingFilters =
          originalFilterSneakers(
            items
          );


        const query =
          normalizeArchiveSearchText(
            archiveSearchQuery
          );


        /*
          Empty search:
          return normal filter results.
        */

        if (!query) {

          return filteredByExistingFilters;

        }


        /*
          Multiple words must all match.

          Example:

          jordan sample

          requires both:
          jordan
          sample
        */

        const searchTerms =
          query

            .split(/\s+/)

            .filter(Boolean);


        return filteredByExistingFilters.filter(

          sneaker => {


            const searchableText =
              getSneakerArchiveSearchText(
                sneaker
              );


            return searchTerms.every(

              term =>

                searchableText.includes(
                  term
                )

            );

          }

        );

      };


    /* =====================================================
       SEARCH TIMER
    ====================================================== */

    let archiveSearchTimer =
      null;


    /* =====================================================
       SEARCH INPUT
    ====================================================== */

    function handleArchiveSearch(value) {

      archiveSearchQuery =
        value;


      updateArchiveSearchUI();


      /*
        Small debounce.

        Keeps search smooth when the collection
        grows to hundreds of sneakers.
      */

      clearTimeout(
        archiveSearchTimer
      );


      archiveSearchTimer =
        setTimeout(

          () => {

            renderGrid();

          },

          70

        );

    }


    /* =====================================================
       CLEAR SEARCH
    ====================================================== */

    function clearArchiveSearch() {

      archiveSearchQuery =
        "";


      clearTimeout(
        archiveSearchTimer
      );


      const input =
        document.getElementById(
          "archive-search-input"
        );


      if (input) {

        input.value =
          "";


        input.focus();

      }


      updateArchiveSearchUI();

      renderGrid();

    }


    /* =====================================================
       ESC KEY
    ====================================================== */

    function handleArchiveSearchKeydown(event) {

      if (
        event.key === "Escape"
      ) {

        clearArchiveSearch();

      }

    }


    /* =====================================================
       SEARCH UI
    ====================================================== */

    function updateArchiveSearchUI() {

      const clearButton =
        document.getElementById(
          "archive-search-clear"
        );


      if (!clearButton) {

        return;

      }


      clearButton.classList.toggle(

        "visible",

        archiveSearchQuery
          .trim()
          .length > 0

      );

    }


    /* =====================================================
       VI / EN SEARCH TRANSLATION
    ====================================================== */

    const originalUpdateStaticText =
      updateStaticText;


    updateStaticText =
      function () {


        /*
          Preserve existing website translations.
        */

        originalUpdateStaticText();


        const label =
          document.getElementById(
            "archive-search-label"
          );


        const input =
          document.getElementById(
            "archive-search-input"
          );


        const clearButton =
          document.getElementById(
            "archive-search-clear"
          );


        /* =================================================
           VIETNAMESE
        ================================================= */

        if (
          currentLang === "vi"
        ) {


          if (label) {

            label.textContent =
              "TÌM KIẾM";

          }


          if (input) {

            input.placeholder =
              "Tìm kiếm...";


            input.setAttribute(
              "aria-label",
              "Tìm kiếm bộ sưu tập"
            );

          }


          if (clearButton) {

            clearButton.setAttribute(
              "aria-label",
              "Xóa tìm kiếm"
            );

          }


        } else {


          /* ===============================================
             ENGLISH
          =============================================== */


          if (label) {

            label.textContent =
              "SEARCH";

          }


          if (input) {

            input.placeholder =
              "Search...";


            input.setAttribute(
              "aria-label",
              "Search collection"
            );

          }


          if (clearButton) {

            clearButton.setAttribute(
              "aria-label",
              "Clear search"
            );

          }

        }

      };


    /* =====================================================
       RESULT COUNTER
    ====================================================== */

    const originalUpdateCollectionCount =
      updateCollectionCount;


    updateCollectionCount =
      function (count) {


        const element =
          document.getElementById(
            "collection-count"
          );


        if (
          !element
          ||
          typeof sneakers === "undefined"
          ||
          !Array.isArray(sneakers)
        ) {

          originalUpdateCollectionCount(
            count
          );


          return;

        }


        const total =
          sneakers.length;


        const searchIsActive =
          archiveSearchQuery
            .trim()
            .length > 0;


        const filtersAreActive =

          activeFilters.edition.size > 0

          ||

          activeFilters.condition.size > 0

          ||

          activeFilters.size.size > 0;


        /*
          Search / Filter active:
          show current result count
          against entire collection.
        */

        if (
          searchIsActive
          ||
          filtersAreActive
        ) {

          element.textContent =

            currentLang === "vi"

              ? `HIỂN THỊ: ${count} / ${total} ĐÔI`

              : `SHOWING: ${count} / ${total} PAIRS`;


          return;

        }


        /*
          Normal collection count.
        */

        originalUpdateCollectionCount(
          count
        );

      };


    /* =====================================================
       SEARCH INIT
    ====================================================== */

    document.addEventListener(

      "DOMContentLoaded",

      () => {

        updateArchiveSearchUI();

      }

    );

  </script>
