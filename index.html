          onclick="setLanguage('vi')"

        <button
          type="button"
          id="btn-en"
          class="lang-btn"
          onclick="setLanguage('en')"
        >
          EN

      </div>

      <h1 data-i18n="mainTitle">
        LỘC AN SNEAKER COLLECTION
      </h1>

      <p data-i18n="mainSubtitle">
        Không gian lưu trữ &amp; Bảo tàng Sneaker Kỹ thuật số

      <nav class="museum-nav">

        <a
          href="./index.html"
          class="museum-nav-link active"

        </a>

        <a

        </a>

          class="museum-nav-link"
        >
          ABOUT
        </a>

      </nav>

    </header>


    <!-- =================================================
         SEARCH ARCHIVE
    ================================================== -->

    <section class="archive-search-panel">

      <div class="archive-search-header">

        <label
          id="archive-search-label"
          for="archive-search-input"
          class="archive-search-label"
        >
          TÌM KIẾM ARCHIVE
        </label>

        <span class="archive-search-hint">
          NAME · SKU · COLORWAY · EDITION
        </span>

      </div>


      <div class="archive-search-box">

        <span
          class="archive-search-icon"
          aria-hidden="true"
        >
          ⌕
        </span>

        <input
          id="archive-search-input"
          class="archive-search-input"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Tìm theo tên, SKU, colorway, collaboration..."
          aria-label="Search sneaker archive"
          oninput="handleArchiveSearch(this.value)"
          onkeydown="handleArchiveSearchKeydown(event)"
        >

        <button
          type="button"
          id="archive-search-clear"
          class="archive-search-clear"
          aria-label="Clear search"
          onclick="clearArchiveSearch()"
        >
          ×
        </button>

      </div>

    </section>


    <!-- =================================================
         SORT
    ================================================== -->

    <section class="collection-toolbar">

      <div class="sort-control">

        <label
          for="sort-select"
          id="sort-label"
        >
          SẮP XẾP
        </label>

        <select
          id="sort-select"
          onchange="changeSort(this.value)"
        >

          <option value="default">
            Mặc định
          </option>

          <option value="az">
            A → Z
          </option>

          <option value="za">
            Z → A
          </option>

          <option value="date-desc">
            Ngày phát hành: Mới → Cũ
          </option>

          <option value="date-asc">
            Ngày phát hành: Cũ → Mới
          </option>

          <option value="size-asc">
            Size nhỏ → lớn
          </option>

          <option value="size-desc">
            Size lớn → nhỏ
          </option>

        </select>

      </div>

    </section>


    <!-- =================================================
         FILTER
    ================================================== -->

    <section class="filter-panel">

      <div class="filter-panel-header">

        <span
          class="filter-main-label"
          id="filter-title"
        >
          BỘ LỌC BỘ SƯU TẬP
        </span>

        <button
          type="button"
          id="clear-filters"
          class="clear-filter-btn"
          onclick="clearAllFilters()"
        >
          XÓA BỘ LỌC
        </button>

      </div>


      <!-- EDITION -->

      <div class="filter-group">

        <div
          id="edition-filter-label"
          class="filter-group-label"
        >
          PHÂN KHÚC
        </div>

        <div class="filter-chips">

          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="PE"
            onclick="toggleFilter('edition', 'PE')"
          >
            PE
          </button>

          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="Sample"
            onclick="toggleFilter('edition', 'Sample')"
          >
            SAMPLE
          </button>

          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="F&F"
            onclick="toggleFilter('edition', 'F&F')"
          >
            F&amp;F
          </button>

          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="Signature Signed"
            onclick="toggleFilter('edition', 'Signature Signed')"
          >
            SIGNATURE SIGNED
          </button>

          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="GR"
            onclick="toggleFilter('edition', 'GR')"
          >
            GR
          </button>

        </div>

      </div>


      <!-- CONDITION -->

      <div class="filter-group">

        <div
          id="condition-filter-label"
          class="filter-group-label"
        >
          TÌNH TRẠNG
        </div>

        <div class="filter-chips">

          <button
            type="button"
            class="filter-chip"
            data-group="condition"
            data-value="Deadstock"
            onclick="toggleFilter('condition', 'Deadstock')"
          >
            DEADSTOCK
          </button>

          <button
            type="button"
            class="filter-chip"
            data-group="condition"
            data-value="Used"
            onclick="toggleFilter('condition', 'Used')"
          >
            USED
          </button>

        </div>

      </div>


      <!-- SIZE -->

      <div class="filter-group">

        <div
          id="size-filter-label"
          class="filter-group-label"
        >
          KÍCH CỠ
        </div>

        <div
          id="size-filter-chips"
          class="filter-chips"
        ></div>

      </div>

    </section>


    <!-- =================================================
         COUNT
    ================================================== -->

    <div
      id="collection-count"
      class="collection-count"
    >
      TỔNG SỐ: 0 ĐÔI
    </div>


    <!-- =================================================
         SNEAKER GRID
    ================================================== -->

    <main>

      <div
        id="sneaker-grid"
        class="grid"
      ></div>

    </main>


    <footer>

      <p>
        &copy; 2026 Lộc An Sneaker Collection.
        All Rights Reserved.
      </p>

    </footer>

  </div>


  <!-- =================================================
       DATA + MAIN JS
  ================================================== -->

  <script
    src="./data.js?v=20260912-search-notice-1"
  ></script>

  <script
    src="./main.js?v=20260912-search-notice-1"
  ></script>


  <!-- =================================================
       SEARCH EXTENSION
  ================================================== -->

  <script>

    let archiveSearchQuery = "";


    function normalizeArchiveSearchText(value) {

      return String(value ?? "")

        .normalize("NFD")

        .replace(
          /[\u0300-\u036f]/g,
          ""
        )

        .toLowerCase()

        .trim();

    }


    function flattenArchiveSearchValue(value) {

      if (
        value == null
      ) {
        return "";
      }


      if (
        typeof value === "string"
        ||
        typeof value === "number"
      ) {

        return String(value);

      }


      if (
        Array.isArray(value)
      ) {

        return value
          .map(
            flattenArchiveSearchValue
          )
          .join(" ");

      }


      if (
        typeof value === "object"
      ) {

        return Object
          .values(value)
          .map(
            flattenArchiveSearchValue
          )
          .join(" ");

      }


      return "";

    }


    function getSneakerArchiveSearchText(sneaker) {

      const fields = [

        sneaker.title,

        sneaker.subtitle,

        sneaker.brand,

        sneaker.collaboration,

        sneaker.sku,

        sneaker.styleCode,

        sneaker.colorway,

        sneaker.editionType,

        sneaker.condition,

        sneaker.size,

        sneaker.releaseDate,

        sneaker.retail,

        sneaker.retailPrice

      ];


      return normalizeArchiveSearchText(

        fields
          .map(
            flattenArchiveSearchValue
          )
          .join(" ")

      );

    }


    /* =====================================================
       EXTEND EXISTING FILTER SYSTEM
    ====================================================== */

    const originalFilterSneakers =
      filterSneakers;


    filterSneakers =
      function (items) {

        const filtered =
          originalFilterSneakers(
            items
          );


        const query =
          normalizeArchiveSearchText(
            archiveSearchQuery
          );


        if (!query) {
          return filtered;
        }


        const terms =
          query
            .split(/\s+/)
            .filter(Boolean);


        return filtered.filter(
          sneaker => {

            const searchableText =
              getSneakerArchiveSearchText(
                sneaker
              );


            return terms.every(
              term =>
                searchableText.includes(
                  term
                )
            );

          }
        );

      };


    /* =====================================================
       SEARCH INPUT
    ====================================================== */

    function handleArchiveSearch(value) {

      archiveSearchQuery =
        value;


      updateArchiveSearchUI();

      renderGrid();

    }


    function clearArchiveSearch() {

      archiveSearchQuery =
        "";


      const input =
        document.getElementById(
          "archive-search-input"
        );


      if (input) {

        input.value =
          "";

        input.focus();

      }


      updateArchiveSearchUI();

      renderGrid();

    }


    function handleArchiveSearchKeydown(event) {

      if (
        event.key === "Escape"
      ) {

        clearArchiveSearch();

      }

    }


    function updateArchiveSearchUI() {

      const clearButton =
        document.getElementById(
          "archive-search-clear"
        );


      if (clearButton) {

        clearButton.classList.toggle(

          "visible",

          archiveSearchQuery
            .trim()
            .length > 0

        );

      }

    }


    /* =====================================================
       VI / EN SEARCH TEXT
    ====================================================== */

    const originalUpdateStaticText =
      updateStaticText;


    updateStaticText =
      function () {

        originalUpdateStaticText();


        const label =
          document.getElementById(
            "archive-search-label"
          );


        const input =
          document.getElementById(
            "archive-search-input"
          );


        if (
          currentLang === "vi"
        ) {

          if (label) {

            label.textContent =
              "TÌM KIẾM ARCHIVE";

          }


          if (input) {

            input.placeholder =
              "Tìm theo tên, SKU, colorway, collaboration...";


            input.setAttribute(
              "aria-label",
              "Tìm kiếm bộ sưu tập sneaker"
            );

          }

        } else {

          if (label) {

            label.textContent =
              "SEARCH ARCHIVE";

          }


          if (input) {

            input.placeholder =
              "Search by name, SKU, colorway, collaboration...";


            input.setAttribute(
              "aria-label",
              "Search sneaker archive"
            );

          }

        }

      };


    /* =====================================================
       SEARCH RESULT COUNTER
    ====================================================== */

    const originalUpdateCollectionCount =
      updateCollectionCount;


    updateCollectionCount =
      function (count) {

        const element =
          document.getElementById(
            "collection-count"
          );


        if (
          !element
          ||
          typeof sneakers === "undefined"
          ||
          !Array.isArray(sneakers)
        ) {

          originalUpdateCollectionCount(
            count
          );

          return;

        }


        const total =
          sneakers.length;


        const hasSearch =
          archiveSearchQuery
            .trim()
            .length > 0;


        const hasFilters =

          activeFilters.edition.size > 0

          ||

          activeFilters.condition.size > 0

          ||

          activeFilters.size.size > 0;


        if (
          hasSearch
          ||
          hasFilters
        ) {

          element.textContent =

            currentLang === "vi"

              ? `HIỂN THỊ: ${count} / ${total} ĐÔI`

              : `SHOWING: ${count} / ${total} PAIRS`;

        } else {

          originalUpdateCollectionCount(
            count
          );

        }

      };


    document.addEventListener(

      "DOMContentLoaded",

      () => {

        updateArchiveSearchUI();

      }

    );

  </script>

</body>

</html>
