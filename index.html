<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Lộc An Sneaker Collection - Digital Sneaker Archive & Museum"
  >

  <meta
    name="theme-color"
    content="#0d0d0d"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>Lộc An Sneaker Collection</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="favicon.svg"
  >

  <link
    rel="apple-touch-icon"
    href="apple-touch-icon.png"
  >

  <link
    rel="manifest"
    href="site.webmanifest"
  >

  <link
    rel="stylesheet"
    href="style.css?v=20260912-10"
  >
</head>


<body>

  <div class="container">

    <header class="home-header">

      <div class="lang-switcher corner-lang">

        <button
          type="button"
          onclick="setLanguage('vi')"
          id="btn-vi"
          class="lang-btn active"
        >
          VI
        </button>

        <button
          type="button"
          onclick="setLanguage('en')"
          id="btn-en"
          class="lang-btn"
        >
          EN
        </button>

      </div>

      <h1 data-i18n="mainTitle">
        LỘC AN SNEAKER COLLECTION
      </h1>

      <p data-i18n="mainSubtitle">
        Không gian lưu trữ &amp; Bảo tàng Sneaker Kỹ thuật số
      </p>

      <nav
        class="museum-nav"
        aria-label="Primary navigation"
      >

        <a
          href="index.html"
          class="museum-nav-link active"
        >
          COLLECTION
        </a>

        <a
          href="about.html"
          class="museum-nav-link"
        >
          ABOUT
        </a>

      </nav>

    </header>


    <section class="collection-toolbar">

      <div class="sort-control">

        <label
          for="sort-select"
          id="sort-label"
        >
          SẮP XẾP
        </label>

        <select
          id="sort-select"
          onchange="changeSort(this.value)"
        >

          <option value="default">
            Mặc định
          </option>

          <option value="az">
            A → Z
          </option>

          <option value="za">
            Z → A
          </option>

          <option value="size-asc">
            Size nhỏ → lớn
          </option>

          <option value="size-desc">
            Size lớn → nhỏ
          </option>

        </select>

      </div>

    </section>


    <main>

      <div
        id="sneaker-grid"
        class="grid"
      ></div>

    </main>


    <footer>

      <p>
        &copy; 2026 Lộc An Sneaker Collection.
        All Rights Reserved.
      </p>

    </footer>

  </div>


  <script src="data.js?v=20260912-10"></script>
  <script src="main.js?v=20260912-10"></script>

</body>

</html>
