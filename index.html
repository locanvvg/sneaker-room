<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Lộc An Sneaker Collection - Digital Sneaker Archive & Museum"
  >

  <title>Lộc An Sneaker Collection</title>

  <link
    rel="stylesheet"
    href="style.css?v=20260912-7"
  >
</head>


<body>

  <div class="container">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="home-header">

      <div class="lang-switcher corner-lang">

        <button
          type="button"
          onclick="setLanguage('vi')"
          id="btn-vi"
          class="lang-btn active"
        >
          VI
        </button>

        <button
          type="button"
          onclick="setLanguage('en')"
          id="btn-en"
          class="lang-btn"
        >
          EN
        </button>

      </div>


      <h1 data-i18n="mainTitle">
        LỘC AN SNEAKER COLLECTION
      </h1>

      <p data-i18n="mainSubtitle">
        Không gian lưu trữ &amp; Bảo tàng Sneaker Kỹ thuật số
      </p>

    </header>


    <!-- =====================================================
         SORT
    ====================================================== -->

    <section class="collection-toolbar">

      <div class="sort-control">

        <label
          for="sort-select"
          id="sort-label"
        >
          SẮP XẾP
        </label>


        <select
          id="sort-select"
          onchange="changeSort(this.value)"
        >

          <option value="default">
            Mặc định
          </option>

          <option value="az">
            A → Z
          </option>

          <option value="za">
            Z → A
          </option>

          <option value="size-asc">
            Size nhỏ → lớn
          </option>

          <option value="size-desc">
            Size lớn → nhỏ
          </option>

        </select>

      </div>

    </section>


    <!-- =====================================================
         COLLECTION
    ====================================================== -->

    <main>

      <div
        id="sneaker-grid"
        class="grid"
      ></div>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

      <p>
        &copy; 2026 Lộc An Sneaker Collection.
        All Rights Reserved.
      </p>

    </footer>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script src="data.js?v=20260912-7"></script>

  <script src="main.js?v=20260912-7"></script>

</body>

</html>
