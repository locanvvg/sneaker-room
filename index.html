<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Lộc An Sneaker Collection - Digital Sneaker Archive & Museum"
  >

  <meta
    name="theme-color"
    content="#0d0d0d"
  >

  <title>
    Lộc An Sneaker Collection
  </title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="./favicon.svg"
  >

  <link
    rel="apple-touch-icon"
    href="./apple-touch-icon.png"
  >

  <link
    rel="manifest"
    href="./site.webmanifest"
  >

  <link
    rel="stylesheet"
    href="./style.css?v=20260912-fix1"
  >

  <link
    rel="stylesheet"
    href="./collection-menu.css?v=20260912-fix1"
  >
</head>


<body>

  <div class="container">


    <header class="home-header">


      <div class="lang-switcher corner-lang">

        <button
          type="button"
          id="btn-vi"
          class="lang-btn active"
          onclick="setLanguage('vi')"
        >
          VI
        </button>


        <button
          type="button"
          id="btn-en"
          class="lang-btn"
          onclick="setLanguage('en')"
        >
          EN
        </button>

      </div>


      <h1 data-i18n="mainTitle">
        LỘC AN SNEAKER COLLECTION
      </h1>


      <p data-i18n="mainSubtitle">
        Không gian lưu trữ &amp; Bảo tàng Sneaker Kỹ thuật số
      </p>


      <nav class="museum-nav">

        <a
          href="./index.html"
          class="museum-nav-link active"
        >
          SNEAKERS
        </a>


        <a
          href="./lego.html"
          class="museum-nav-link"
        >
          LEGO
        </a>


        <a
          href="./sneaker-mask.html"
          class="museum-nav-link"
        >
          SNEAKER MASK
        </a>


        <a
          href="./about.html"
          class="museum-nav-link"
        >
          ABOUT
        </a>

      </nav>

    </header>


    <!-- =================================================
         SORT
    ================================================== -->

    <section class="collection-toolbar">

      <div class="sort-control">

        <label
          for="sort-select"
          id="sort-label"
        >
          SẮP XẾP
        </label>


        <select
          id="sort-select"
          onchange="changeSort(this.value)"
        >

          <option value="default">
            Mặc định
          </option>


          <option value="az">
            A → Z
          </option>


          <option value="za">
            Z → A
          </option>


          <option value="date-desc">
            Ngày phát hành: Mới → Cũ
          </option>


          <option value="date-asc">
            Ngày phát hành: Cũ → Mới
          </option>


          <option value="size-asc">
            Size nhỏ → lớn
          </option>


          <option value="size-desc">
            Size lớn → nhỏ
          </option>

        </select>

      </div>

    </section>


    <!-- =================================================
         FILTER
    ================================================== -->

    <section class="filter-panel">


      <div class="filter-panel-header">

        <span
          class="filter-main-label"
          id="filter-title"
        >
          BỘ LỌC BỘ SƯU TẬP
        </span>


        <button
          type="button"
          id="clear-filters"
          class="clear-filter-btn"
          onclick="clearAllFilters()"
        >
          XÓA BỘ LỌC
        </button>

      </div>


      <!-- PHÂN KHÚC -->

      <div class="filter-group">

        <div
          id="edition-filter-label"
          class="filter-group-label"
        >
          PHÂN KHÚC
        </div>


        <div class="filter-chips">

          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="PE"
            onclick="toggleFilter('edition', 'PE')"
          >
            PE
          </button>


          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="Sample"
            onclick="toggleFilter('edition', 'Sample')"
          >
            SAMPLE
          </button>


          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="F&F"
            onclick="toggleFilter('edition', 'F&F')"
          >
            F&amp;F
          </button>


          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="Signature Signed"
            onclick="toggleFilter('edition', 'Signature Signed')"
          >
            SIGNATURE SIGNED
          </button>


          <button
            type="button"
            class="filter-chip"
            data-group="edition"
            data-value="GR"
            onclick="toggleFilter('edition', 'GR')"
          >
            GR
          </button>

        </div>

      </div>


      <!-- TÌNH TRẠNG -->

      <div class="filter-group">

        <div
          id="condition-filter-label"
          class="filter-group-label"
        >
          TÌNH TRẠNG
        </div>


        <div class="filter-chips">

          <button
            type="button"
            class="filter-chip"
            data-group="condition"
            data-value="Deadstock"
            onclick="toggleFilter('condition', 'Deadstock')"
          >
            DEADSTOCK
          </button>


          <button
            type="button"
            class="filter-chip"
            data-group="condition"
            data-value="Used"
            onclick="toggleFilter('condition', 'Used')"
          >
            USED
          </button>

        </div>

      </div>


      <!-- SIZE -->

      <div class="filter-group">

        <div
          id="size-filter-label"
          class="filter-group-label"
        >
          KÍCH CỠ
        </div>


        <div
          id="size-filter-chips"
          class="filter-chips"
        ></div>

      </div>

    </section>


    <!-- =================================================
         TOTAL
    ================================================== -->

    <div
      id="collection-count"
      class="collection-count"
    >
      TỔNG SỐ: 0 ĐÔI
    </div>


    <!-- =================================================
         GRID
    ================================================== -->

    <main>

      <div
        id="sneaker-grid"
        class="grid"
      ></div>

    </main>


    <footer>

      <p>
        &copy; 2026 Lộc An Sneaker Collection.
        All Rights Reserved.
      </p>

    </footer>


  </div>


  <script
    src="./data.js?v=20260912-fix1"
  ></script>


  <script
    src="./main.js?v=20260912-fix1"
  ></script>


</body>

</html>
