  <!-- =====================================================
       ORIGINAL INLINE SEARCH EXTENSION
       Keeps the existing data/main.js architecture untouched.
  ====================================================== -->

  <script>

    let archiveSearchQuery = "";


    function normalizeArchiveSearchText(value) {

      return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();

    }


    function flattenArchiveSearchValue(value) {

      if (
        value === null
        ||
        value === undefined
      ) {
        return "";
      }


      if (
        typeof value === "string"
        ||
        typeof value === "number"
      ) {
        return String(value);
      }


      if (Array.isArray(value)) {
        return value
          .map(flattenArchiveSearchValue)
          .join(" ");
      }


      if (typeof value === "object") {
        return Object
          .values(value)
          .map(flattenArchiveSearchValue)
          .join(" ");
      }


      return "";

    }


    function getSneakerArchiveSearchText(sneaker) {

      const searchableFields = [

        sneaker.title,
        sneaker.subtitle,
        sneaker.brand,
        sneaker.collaboration,
        sneaker.sku,
        sneaker.styleCode,
        sneaker.colorway,
        sneaker.editionType,
        sneaker.condition,
        sneaker.size,
        sneaker.releaseDate,
        sneaker.retail,
        sneaker.retailPrice

      ];


      return normalizeArchiveSearchText(

        searchableFields
          .map(flattenArchiveSearchValue)
          .join(" ")

      );

    }


    const originalFilterSneakers =
      filterSneakers;


    filterSneakers =
      function (items) {

        const filteredByExistingFilters =
          originalFilterSneakers(items);


        const query =
          normalizeArchiveSearchText(
            archiveSearchQuery
          );


        if (!query) {
          return filteredByExistingFilters;
        }


        const searchTerms =
          query
            .split(/\s+/)
            .filter(Boolean);


        return filteredByExistingFilters.filter(

          sneaker => {

            const searchableText =
              getSneakerArchiveSearchText(
                sneaker
              );


            return searchTerms.every(
              term =>
                searchableText.includes(term)
            );

          }

        );

      };


    let archiveSearchTimer =
      null;


    function handleArchiveSearch(value) {

      archiveSearchQuery =
        value;


      updateArchiveSearchUI();


      clearTimeout(
        archiveSearchTimer
      );


      archiveSearchTimer =
        setTimeout(
          () => {
            renderGrid();
          },
          70
        );

    }


    function clearArchiveSearch() {

      archiveSearchQuery =
        "";


      clearTimeout(
        archiveSearchTimer
      );


      const input =
        document.getElementById(
          "archive-search-input"
        );


      if (input) {

        input.value =
          "";


        input.focus();

      }


      updateArchiveSearchUI();
      renderGrid();

    }


    function handleArchiveSearchKeydown(event) {

      if (
        event.key === "Escape"
      ) {

        clearArchiveSearch();

      }

    }


    function updateArchiveSearchUI() {

      const clearButton =
        document.getElementById(
          "archive-search-clear"
        );


      if (clearButton) {

        clearButton.classList.toggle(
          "visible",
          archiveSearchQuery
            .trim()
            .length > 0
        );

      }

    }


    const originalUpdateStaticText =
      updateStaticText;


    updateStaticText =
      function () {

        originalUpdateStaticText();


        const label =
          document.getElementById(
            "archive-search-label"
          );


        const input =
          document.getElementById(
            "archive-search-input"
          );


        const clearButton =
          document.getElementById(
            "archive-search-clear"
          );


        if (
          currentLang === "vi"
        ) {

          if (label) {
            label.textContent =
              "TÌM KIẾM";
          }


          if (input) {

            input.placeholder =
              "Tìm kiếm...";


            input.setAttribute(
              "aria-label",
              "Tìm kiếm bộ sưu tập"
            );

          }


          if (clearButton) {

            clearButton.setAttribute(
              "aria-label",
              "Xóa tìm kiếm"
            );

          }

        } else {

          if (label) {
            label.textContent =
              "SEARCH";
          }


          if (input) {

            input.placeholder =
              "Search...";


            input.setAttribute(
              "aria-label",
              "Search collection"
            );

          }


          if (clearButton) {

            clearButton.setAttribute(
              "aria-label",
              "Clear search"
            );

          }

        }

      };


    const originalUpdateCollectionCount =
      updateCollectionCount;


    updateCollectionCount =
      function (count) {

        const element =
          document.getElementById(
            "collection-count"
          );


        if (
          !element
          ||
          typeof sneakers === "undefined"
          ||
          !Array.isArray(sneakers)
        ) {

          originalUpdateCollectionCount(
            count
          );

          return;

        }


        const total =
          sneakers.length;


        const searchIsActive =
          archiveSearchQuery
            .trim()
            .length > 0;


        const filtersAreActive =
          (
            activeFilters?.edition?.size > 0
          )
          ||
          (
            activeFilters?.condition?.size > 0
          )
          ||
          (
            activeFilters?.size?.size > 0
          )
          ||
          (
            activeFilters?.collection?.size > 0
          );


        if (
          searchIsActive
          ||
          filtersAreActive
        ) {

          element.textContent =

            currentLang === "vi"

              ? `HIỂN THỊ: ${count} / ${total} ĐÔI`

              : `SHOWING: ${count} / ${total} PAIRS`;


          return;

        }


        originalUpdateCollectionCount(
          count
        );

      };


    document.addEventListener(

      "DOMContentLoaded",

      () => {

        updateArchiveSearchUI();

      }

    );

  </script>
