<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lộc An Sneaker Collection - Exhibition Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="lang-switcher">
        <button onclick="setLanguage('vi')" id="btn-vi" class="lang-btn active">VI</button>
        <button onclick="setLanguage('en')" id="btn-en" class="lang-btn">EN</button>
      </div>
      <h1 data-i18n="mainTitle">LỘC AN SNEAKER COLLECTION</h1>
      <p data-i18n="mainSubtitle">Không gian lưu trữ & Bảo tàng Sneaker Kỹ thuật số</p>
    </header>

    <main>
      <div id="sneaker-grid" class="grid">
        <!-- Danh sách giày tự động load từ data.js -->
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Lộc An Sneaker Collection. All Rights Reserved.</p>
    </footer>
  </div>

  <script src="data.js"></script>
  <script>
    let currentLang = localStorage.getItem('locan_lang') || 'vi';

    const translations = {
      vi: {
        mainTitle: "LỘC AN SNEAKER COLLECTION",
        mainSubtitle: "Không gian lưu trữ & Bảo tàng Sneaker Kỹ thuật số",
        loading: "Đang cập nhật dữ liệu bộ sưu tập..."
      },
      en: {
        mainTitle: "LỘC AN SNEAKER COLLECTION",
        mainSubtitle: "Digital Sneaker Archive & Museum",
        loading: "Updating collection data..."
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('locan_lang', lang);
      
      document.getElementById('btn-vi').classList.toggle('active', lang === 'vi');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('sneaker-grid');
      if (typeof sneakers !== 'undefined' && sneakers.length > 0) {
        const sortedSneakers = [...sneakers].sort((a, b) => 
          a.title[currentLang].localeCompare(b.title[currentLang], 'en', { sensitivity: 'base' })
        );

        grid.innerHTML = sortedSneakers.map(shoe => {
          const badgeText = shoe.editionType[currentLang] ? `<span class="badge">${shoe.editionType[currentLang]}</span>` : '';
          return `
            <a href="shoe.html?id=${shoe.id}&lang=${currentLang}" class="card-link">
              <div class="card">
                <div class="card-img-wrapper">
                  <img src="${shoe.image}" alt="${shoe.title[currentLang]}">
                </div>
                <div class="card-info">
                  <h3>${shoe.title[currentLang]}</h3>
                  <p class="subtitle">${shoe.subtitle[currentLang]}</p>
                  <div class="card-meta">
                    ${badgeText}
                    <span class="size">${shoe.size || ''}</span>
                  </div>
                </div>
              </div>
            </a>
          `;
        }).join('');
      } else {
        grid.innerHTML = `<p style="color: #888; text-align: center; grid-column: 1/-1;">${translations[currentLang].loading}</p>`;
      }
    }

    setLanguage(currentLang);
  </script>
</body>
</html>
