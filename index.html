<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lộc An Vault - Secure Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="vault-gate-container">
    <div class="vault-header">
      <h1>Lộc An Vault</h1>
      <p>SECURE DIGITAL ARCHIVE & COLLECTION</p>
    </div>

    <!-- Khu vực bánh xoay lựa chọn bộ sưu tập -->
    <div class="vault-dial-wrapper">
      <div class="vault-dial-track">
        
        <!-- Mục 1: Sneaker Collection (Đã mở khóa) -->
        <a href="sneakers.html" class="vault-slot">
          <!-- Bạn có thể thay hình nền đại diện bằng một đôi giày nổi bật trong bộ sưu tập -->
          <img src="jordan1_pe_bloodline_friendsandfamily_sample.png" alt="Sneaker Collection">
          <div class="vault-slot-info">
            <h3>Sneakers</h3>
            <span>[ UNLOCKED ]</span>
          </div>
        </a>

        <!-- Mục 2: Lego Collection (Đang chuẩn bị / Khóa) -->
        <div class="vault-slot locked">
          <img src="" alt="Lego Collection" style="background: #111;">
          <div class="vault-slot-info">
            <h3>Lego Models</h3>
            <span>[ LOCKED / COMING SOON ]</span>
          </div>
        </div>

        <!-- Mục 3: Vintage Audio (Đang chuẩn bị / Khóa) -->
        <div class="vault-slot locked">
          <img src="" alt="Vintage Audio" style="background: #111;">
          <div class="vault-slot-info">
            <h3>Vintage Audio</h3>
            <span>[ LOCKED / COMING SOON ]</span>
          </div>
        </div>

        <!-- Mục 4: Cameras & Tech (Đang chuẩn bị / Khóa) -->
        <div class="vault-slot locked">
          <img src="" alt="Cameras & Tech" style="background: #111;">
          <div class="vault-slot-info">
            <h3>Cameras & Tech</h3>
            <span>[ LOCKED / COMING SOON ]</span>
          </div>
        </div>

      </div>
    </div>

    <div class="vault-status-indicator">
      ROTATE / SELECT VAULT WING TO ACCESS
    </div>
  </main>

</body>
</html>
