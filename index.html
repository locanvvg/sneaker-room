<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lộc An Sneaker Collection - Exhibition Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>LỘC AN SNEAKER COLLECTION</h1>
      <p>Không gian lưu trữ & Bảo tàng Sneaker Kỹ thuật số</p>
    </header>

    <main>
      <div id="sneaker-grid" class="grid">
        <!-- Danh sách giày tự động load từ data.js -->
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Lộc An Sneaker Collection. All Rights Reserved.</p>
    </footer>
  </div>

  <script src="data.js"></script>
  <script>
    const grid = document.getElementById('sneaker-grid');

    if (typeof sneakers !== 'undefined' && sneakers.length > 0) {
      const sortedSneakers = [...sneakers].sort((a, b) => 
        a.title.localeCompare(b.title, 'en', { sensitivity: 'base' })
      );

      grid.innerHTML = sortedSneakers.map(shoe => `
        <a href="shoe.html?id=${shoe.id}" class="card-link">
          <div class="card">
            <div class="card-img-wrapper">
              <img src="${shoe.image}" alt="${shoe.title}">
            </div>
            <div class="card-info">
              <h3>${shoe.title}</h3>
              <p class="subtitle">${shoe.subtitle}</p>
              <div class="card-meta">
                <span class="badge">${shoe.editionType || 'Limited'}</span>
                <span class="size">${shoe.size || ''}</span>
              </div>
            </div>
          </div>
        </a>
      `).join('');
    } else {
      grid.innerHTML = '<p style="color: #888; text-align: center; grid-column: 1/-1;">Đang cập nhật dữ liệu bộ sưu tập...</p>';
    }
  </script>
</body>
</html>
