<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lộc An Sneaker Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="collection-container">
    <!-- Nút quay về Vault -->
    <nav class="collection-nav">
      <a href="index.html" class="back-link">← Quay lại Vault</a>
    </nav>

    <!-- Tiêu đề bộ sưu tập -->
    <header class="collection-header">
      <h1>Lộc An Sneaker Collection</h1>
      <p>Không gian lưu trữ & Bảo tàng Sneaker Kỹ thuật số</p>
    </header>

    <!-- Khu vực hiển thị danh sách giày (Render tự động từ data.js) -->
    <div id="sneakerGrid" class="sneaker-grid">
      <!-- Các card giày sẽ được chèn tự động bằng JavaScript -->
    </div>
  </div>

  <!-- Nhúng file dữ liệu -->
  <script src="data.js"></script>
  <script>
    // Load danh sách giày từ data.js ra giao diện dạng lưới (Grid)
    const grid = document.getElementById('sneakerGrid');

    if (typeof sneakersData !== 'undefined' && sneakersData.length > 0) {
      grid.innerHTML = sneakersData.map(item => `
        <div class="sneaker-card" onclick="location.href='shoe.html?id=${item.id}'">
          <div class="sneaker-img-wrapper">
            <img src="${item.image}" alt="${item.name}" loading="lazy">
            <span class="sneaker-badge">${item.badge || 'Archive'}</span>
          </div>
          <div class="sneaker-info">
            <span class="sneaker-brand">${item.brand}</span>
            <h3>${item.name}</h3>
            <p class="sneaker-desc">${item.shortDesc || item.description || ''}</p>
          </div>
        </div>
      `).join('');
    } else {
      grid.innerHTML = '<p style="color: #777; text-align: center; grid-column: 1/-1;">Không tìm thấy dữ liệu sneaker nào.</p>';
    }
  </script>
</body>
</html>
