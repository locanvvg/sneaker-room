<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lộc An Sneaker Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="collection-header">
    <a href="index.html" class="back-to-vault">← Back to Vault</a>
    <h1>LỘC AN SNEAKER COLLECTION</h1>
    <p>Không gian lưu trữ & Bảo tàng Sneaker Kỹ thuật số</p>
  </header>

  <main class="container">
    <div id="sneaker-grid" class="sneaker-grid">
      <!-- Dữ liệu giày sẽ được load tự động từ data.js -->
    </div>
  </main>

  <script src="data.js"></script>
  <script>
    const grid = document.getElementById('sneaker-grid');
    sneakers.forEach(item => {
      const card = document.createElement('a');
      card.href = `shoe.html?id=${item.id}`;
      card.className = 'sneaker-card';
      card.innerHTML = `
        <div class="sneaker-img-wrapper">
          <img src="${item.image}" alt="${item.title}">
        </div>
        <div class="sneaker-info">
          <h2>${item.title}</h2>
          <p class="subtitle">${item.subtitle}</p>
          <p class="meta">${item.editionType} • Size ${item.size}</p>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
