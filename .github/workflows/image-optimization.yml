name: Build optimized site assets

on:
  workflow_dispatch:
  push:
    paths:
      - "data.js"
      - "catalog-additions.js"
      - "lego-data.js"
      - "sneaker-mask-data.js"
      - "item-share.js"
      - "pictures/**"
      - "!pictures/normalized/**"
      - "!pictures/optimized/**"
      - "tools/normalize-sneaker-images.mjs"
      - "tools/optimize-images.mjs"
      - "tools/generate-share-pages.mjs"
      - ".github/workflows/image-optimization.yml"

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install image tools
        run: npm install --no-save sharp

      - name: Normalize all sneaker images to one visual standard
        run: node tools/normalize-sneaker-images.mjs --write

      - name: Create optimized WebP copies
        run: node tools/optimize-images.mjs --write

      - name: Build item share previews
        run: node tools/generate-share-pages.mjs

      - name: Commit generated assets
        shell: bash
        run: |
          git add -A pictures/normalized pictures/optimized share

          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Normalize and optimize collection images [skip ci]"
          git push
