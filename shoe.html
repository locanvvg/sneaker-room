    href="./apple-touch-icon.png"

  <style>
    /* Detail gallery extension only. Existing site design remains unchanged. */

    .shoe-image-section {
      position: relative;
    }

    .shoe-detail-gallery {
      width: 100%;
    }

    .shoe-detail-main-frame {
      position: relative;
      width: 100%;
    }

    .shoe-detail-main-frame #shoe-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .shoe-gallery-nav {
      position: absolute;
      inset: 50% 12px auto 12px;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 4;
    }

    .shoe-gallery-arrow {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(13,13,13,.78);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      pointer-events: auto;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .shoe-gallery-arrow:hover {
      border-color: rgba(255,255,255,.5);
    }

    .shoe-gallery-thumbnails {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .shoe-gallery-thumb {
      width: 72px;
      height: 72px;
      padding: 4px;
      border: 1px solid #303034;
      border-radius: 9px;
      background: #151517;
      cursor: pointer;
      opacity: .62;
    }

    .shoe-gallery-thumb.active {
      opacity: 1;
      border-color: #ffcc00;
    }

    .shoe-gallery-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .shoe-gallery-counter {
      margin-top: 10px;
      text-align: center;
      color: #777;
      font-size: .72rem;
      letter-spacing: .08em;
    }

    .shoe-gallery-nav[hidden],
    .shoe-gallery-thumbnails[hidden],
    .shoe-gallery-counter[hidden] {
      display: none !important;
    }

    @media (max-width: 650px) {
      .shoe-gallery-arrow {
        width: 38px;
        height: 38px;
      }

      .shoe-gallery-thumb {
        width: 62px;
        height: 62px;
      }
    }
  </style>
</head>

<body>

      </p>

      <nav

        aria-label="Collection navigation"
      >

          href="./index.html"

        <a

          class="museum-nav-link"

          LEGO

        <a

          SNEAKER MASK
        </a>

    <div>

    <main

        <div

            <div

          </div>

          <div class="spec-item">
            <span
              class="spec-label"
              id="label-retail"
            >

            </span>
            <span

          </div>

          <div class="spec-item">
            <span
              class="spec-label"

              NGÀY RA MẮT
            </span>
            <span

          <div class="spec-item">
            <span

      <div id="shoe-story"></div>

    <footer>
      <p>

      </p>
    </footer>

  </div>

  <script src="./data.js?v=20260913-15pairs-v1"></script>
  <script src="./collection-content-final.js?v=20260917-final"></script>

  <script>
    const supportedLanguages = [
      "vi",
      "en"
    ];

    const params =
      new URLSearchParams(
        window.location.search
      );

    const shoeId =
      params.get("id");

    let currentLang =
      normalizeLanguage(
        params.get("lang") ||
        localStorage.getItem("locan_lang") ||
        "vi"
      );

    let galleryState = {
      images: [],
      index: 0,
      title: ""
    };

    const labels = {
      vi: {
        back: "← QUAY LẠI BỘ SƯU TẬP",
        sku: "MÃ SẢN PHẨM",
        colorway: "PHỐI MÀU",
        retail: "GIÁ PHÁT HÀNH",
        date: "NGÀY RA MẮT",
        condition: "TÌNH TRẠNG",
        size: "KÍCH CỠ",
        story: "CÂU CHUYỆN & BỐI CẢNH THIẾT KẾ",
        notFound: "Không tìm thấy sneaker.",
        subtitle: "Không gian lưu trữ & Bảo tàng Sneaker Kỹ thuật số",
        previous: "Ảnh trước",
        next: "Ảnh tiếp theo"
      },

      en: {
        back: "← BACK TO COLLECTION",
        sku: "SKU / STYLE CODE",
        colorway: "COLORWAY",
        retail: "RETAIL",
        date: "RELEASE DATE",
        condition: "CONDITION",
        size: "SIZE",
        story: "STORY & DESIGN CONTEXT",
        notFound: "Sneaker not found.",
        subtitle: "Digital Sneaker Archive & Museum",
        previous: "Previous image",
        next: "Next image"
      }
    };

    function normalizeLanguage(lang) {
      return supportedLanguages.includes(lang)
        ? lang
        : "vi";
    }

    function localized(value) {
      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      if (
        typeof value === "string" ||
        typeof value === "number"
      ) {
        return String(value);
      }

      if (
        typeof value === "object"
      ) {
        return (
          value[currentLang] ??
          value.vi ??
          value.en ??
          ""
        );
      }

      return "";
    }

    function formatDate(value) {
      if (!value) {
        return "N/A";
      }

      const raw =
        String(value);

      const exact =
        /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);

      if (exact) {
        const [, year, month, day] =
          exact;

        return currentLang === "vi"
          ? `${day}/${month}/${year}`
          : `${year}-${month}-${day}`;
      }

      const monthOnly =
        /^(\d{4})-(\d{2})$/.exec(raw);

      if (monthOnly) {
        const [, year, month] =
          monthOnly;

        return currentLang === "vi"
          ? `${month}/${year}`
          : `${year}-${month}`;
      }

      return raw;
    }

    function changeLang(lang) {
      currentLang =
        normalizeLanguage(lang);

      localStorage.setItem(
        "locan_lang",
        currentLang
      );

      const newURL =
        new URL(
          window.location.href
        );

      newURL.searchParams.set(
        "lang",
        currentLang
      );

      window.history.replaceState(
        {},
        "",
        newURL.pathname +
        newURL.search +
        newURL.hash
      );

      loadShoe();
    }

    function updateLanguageInterface() {
      document.documentElement.lang =
        currentLang;

      const language =
        labels[currentLang];

      document
        .getElementById("btn-vi")
        .classList.toggle(
          "active",
          currentLang === "vi"
        );

      document
        .getElementById("btn-en")
        .classList.toggle(
          "active",
          currentLang === "en"
        );

      document
        .getElementById(
          "detail-main-subtitle"
        )
        .textContent =
        language.subtitle;

      const backLink =
        document.getElementById(
          "back-link"
        );

      backLink.textContent =
        language.back;

      backLink.href =
        "./index.html?lang=" +
        encodeURIComponent(
          currentLang
        );

      document
        .getElementById("label-sku")
        .textContent =
        language.sku;

      document
        .getElementById("label-colorway")
        .textContent =
        language.colorway;

      document
        .getElementById("label-retail")
        .textContent =
        language.retail;

      document
        .getElementById("label-date")
        .textContent =
        language.date;

      document
        .getElementById("label-condition")
        .textContent =
        language.condition;

      document
        .getElementById("label-size")
        .textContent =
        language.size;

      document
        .getElementById("story-title")
        .textContent =
        language.story;

      document
        .getElementById(
          "shoe-gallery-prev"
        )
        .setAttribute(
          "aria-label",
          language.previous
        );

      document
        .getElementById(
          "shoe-gallery-next"
        )
        .setAttribute(
          "aria-label",
          language.next
        );
    }

    function canLoadImage(src) {
      return new Promise(resolve => {
        if (!src) {
          resolve(false);
          return;
        }

        const image =
          new Image();

        image.onload =
          () => resolve(true);

        image.onerror =
          () => resolve(false);

        image.src =
          src;
      });
    }

    async function resolveGalleryImages(
      sneaker
    ) {
      const candidates = [
        sneaker.image,
        ...(Array.isArray(
          sneaker.imageCandidates
        )
          ? sneaker.imageCandidates
          : []),
        ...(Array.isArray(
          sneaker.images
        )
          ? sneaker.images
          : [])
      ]
        .filter(Boolean)
        .filter(
          (value, index, array) =>
            array.indexOf(value) === index
        );

      const checks =
        await Promise.all(
          candidates.map(
            async src => ({
              src,
              ok:
                await canLoadImage(
                  src
                )
            })
          )
        );

      const valid =
        checks
          .filter(item => item.ok)
          .map(item => item.src);

      if (
        !valid.length &&
        sneaker.image
      ) {
        valid.push(
          sneaker.image
        );
      }

      return valid;
    }

    function renderGallery() {
      const image =
        document.getElementById(
          "shoe-image"
        );

      const nav =
        document.getElementById(
          "shoe-gallery-nav"
        );

      const thumbnails =
        document.getElementById(
          "shoe-gallery-thumbnails"
        );

      const counter =
        document.getElementById(
          "shoe-gallery-counter"
        );

      if (
        !galleryState.images.length
      ) {
        image.removeAttribute(
          "src"
        );

        nav.hidden =
          true;

        thumbnails.hidden =
          true;

        counter.hidden =
          true;

        return;
      }

      galleryState.index =
        (
          galleryState.index +
          galleryState.images.length
        )
        %
        galleryState.images.length;

      image.src =
        galleryState.images[
          galleryState.index
        ];

      image.alt =
        galleryState.images.length > 1
          ? `${galleryState.title} — ${galleryState.index + 1}`
          : galleryState.title;

      const multiple =
        galleryState.images.length > 1;

      nav.hidden =
        !multiple;

      thumbnails.hidden =
        !multiple;

      counter.hidden =
        !multiple;

      thumbnails.innerHTML =
        "";

      if (multiple) {
        galleryState.images.forEach(
          (src, index) => {
            const button =
              document.createElement(
                "button"
              );

            button.type =
              "button";

            button.className =
              "shoe-gallery-thumb" +
              (
                index ===
                galleryState.index
                  ? " active"
                  : ""
              );

            button.setAttribute(
              "aria-label",
              `${galleryState.title} ${index + 1}`
            );

            const thumb =
              document.createElement(
                "img"
              );

            thumb.src =
              src;

            thumb.alt =
              "";

            thumb.decoding =
              "async";

            button.appendChild(
              thumb
            );

            button.addEventListener(
              "click",
              () => {
                galleryState.index =
                  index;

                renderGallery();
              }
            );

            thumbnails.appendChild(
              button
            );
          }
        );

        counter.textContent =
          `${galleryState.index + 1} / ${galleryState.images.length}`;
      }
    }

    function previousGalleryImage() {
      galleryState.index -= 1;
      renderGallery();
    }

    function nextGalleryImage() {
      galleryState.index += 1;
      renderGallery();
    }

    async function buildGallery(
      sneaker,
      title
    ) {
      galleryState = {
        images:
          await resolveGalleryImages(
            sneaker
          ),
        index: 0,
        title
      };

      renderGallery();
    }

    async function loadShoe() {
      updateLanguageInterface();

      if (
        typeof sneakers === "undefined" ||
        !Array.isArray(sneakers)
      ) {
        showNotFound();
        return;
      }

      const sneaker =
        sneakers.find(
          item =>
            item.id === shoeId
        );

      if (!sneaker) {
        showNotFound();
        return;
      }

      document
        .getElementById(
          "story-section"
        )
        .style.display =
        "block";

      const title =
        localized(
          sneaker.title
        );

      document.title =
        title +
        " | Lộc An Sneaker Collection";

      document
        .getElementById(
          "shoe-title"
        )
        .textContent =
        title;

      document
        .getElementById(
          "shoe-subtitle"
        )
        .textContent =
        localized(
          sneaker.subtitle
        );

      document
        .getElementById(
          "shoe-sku"
        )
        .textContent =
        sneaker.sku ||
        "N/A";

      document
        .getElementById(
          "shoe-colorway"
        )
        .textContent =
        sneaker.colorway ||
        "N/A";

      document
        .getElementById(
          "shoe-retail"
        )
        .textContent =
        sneaker.retailPrice ||
        sneaker.retail ||
        "N/A";

      document
        .getElementById(
          "shoe-date"
        )
        .textContent =
        formatDate(
          sneaker.releaseDate
        );

      const condition =
        localized(
          sneaker.condition
        ) ||
        "N/A";

      const conditionNode =
        document.getElementById(
          "shoe-condition"
        );

      conditionNode.textContent =
        condition;

      conditionNode.classList.toggle(
        "condition-deadstock",
        condition === "Deadstock"
      );

      conditionNode.classList.toggle(
        "condition-used",
        condition === "Used"
      );

      document
        .getElementById(
          "shoe-size"
        )
        .textContent =
        sneaker.size ||
        "N/A";

      document
        .getElementById(
          "shoe-story"
        )
        .innerHTML =
        localized(
          sneaker.story
        );

      await buildGallery(
        sneaker,
        title
      );
    }

    function showNotFound() {
      document.title =
        labels[currentLang].notFound;

      document
        .getElementById(
          "shoe-detail"
        )
        .innerHTML = `
          <div class="not-found">
            <p>
              ${labels[currentLang].notFound}
            </p>
          </div>
        `;

      document
        .getElementById(
          "story-section"
        )
        .style.display =
        "none";
    }

    document
      .getElementById(
        "shoe-gallery-prev"
      )
      .addEventListener(
        "click",
        previousGalleryImage
      );

    document
      .getElementById(
        "shoe-gallery-next"
      )
      .addEventListener(
        "click",
        nextGalleryImage
      );

    document.addEventListener(
      "keydown",
      event => {
        if (
          galleryState.images.length <= 1
        ) {
          return;
        }

        if (
          event.key === "ArrowLeft"
        ) {
          previousGalleryImage();
        }

        if (
          event.key === "ArrowRight"
        ) {
          nextGalleryImage();
        }
      }
    );

    let touchStartX =
      null;

    const swipeZone =
      document.getElementById(
        "shoe-gallery-swipe-zone"
      );

    swipeZone.addEventListener(
      "touchstart",
      event => {
        touchStartX =
          event.touches?.[0]?.clientX ??
          null;
      },
      {
        passive: true
      }
    );

    swipeZone.addEventListener(
      "touchend",
      event => {
        if (
          touchStartX === null ||
          galleryState.images.length <= 1
        ) {
          touchStartX =
            null;
          return;
        }

        const endX =
          event.changedTouches?.[0]?.clientX;

        if (
          typeof endX !== "number"
        ) {
          touchStartX =
            null;
          return;
        }

        const delta =
          endX -
          touchStartX;

        if (
          Math.abs(delta) >= 45
        ) {
          if (delta > 0) {
            previousGalleryImage();
          } else {
            nextGalleryImage();
          }
        }

        touchStartX =
          null;
      },
      {
        passive: true
      }
    );

    document.addEventListener(
      "DOMContentLoaded",
      loadShoe
    );
  </script>
</body>
