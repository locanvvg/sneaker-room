<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết Sneaker - Lộc An Vault</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0a0a0c; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    .detail-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    .back-link { color: #888; text-decoration: none; font-size: 0.9rem; letter-spacing: 1px; }
    .back-link:hover { color: #fff; }
    .shoe-header { margin-top: 30px; margin-bottom: 20px; }
    .shoe-header h1 { font-size: 1.8rem; margin: 0 0 10px 0; letter-spacing: 1px; }
    .shoe-subtitle { color: #ffcc00; font-size: 0.95rem; letter-spacing: 1px; margin-bottom: 20px; }
    .shoe-image-large { width: 100%; max-height: 500px; object-fit: cover; border-radius: 12px; background: #141417; border: 1px solid #222; margin-bottom: 30px; }
    .specs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: #141417; padding: 20px; border-radius: 10px; border: 1px solid #222; margin-bottom: 30px; }
    .spec-item span { display: block; font-size: 0.75rem; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .spec-item strong { font-size: 0.95rem; color: #fff; }
    
    /* Ô ghi chú lưu trữ màu vàng */
    .exhibition-note {
      background: rgba(255, 204, 0, 0.08);
      border-left: 4px solid #ffcc00;
      padding: 15px 20px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 30px;
      color: #ffd700;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .story-section h2 { font-size: 1.2rem; border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 20px; letter-spacing: 1px; text-transform: uppercase; }
    .story-content { color: #ccc; line-height: 1.8; font-size: 0.95rem; }
    .story-content p { margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="detail-container">
    <nav>
      <a href="sneakers.html" class="back-link">← Quay lại danh sách Sneaker</a>
    </nav>

    <div id="shoeDetailContent">
      <!-- Dữ liệu chi tiết sẽ được render ở đây -->
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const shoeId = urlParams.get('id');
    const container = document.getElementById('shoeDetailContent');

    if (typeof sneakersData !== 'undefined') {
      const shoe = sneakersData.find(item => item.id === shoeId);
      if (shoe) {
        document.title = `${shoe.title} - Lộc An Vault`;
        container.innerHTML = `
          <div class="shoe-header">
            <h1>${shoe.title}</h1>
            <div class="shoe-subtitle">${shoe.subtitle}</div>
          </div>
          <img src="${shoe.image}" alt="${shoe.title}" class="shoe-image-large">
          
          <div class="specs-grid">
            <div class="spec-item"><span>SKU / Serial</span><strong>${shoe.sku || 'N/A'}</strong></div>
            <div class="spec-item"><span>Colorway</span><strong>${shoe.colorway || 'N/A'}</strong></div>
            <div class="spec-item"><span>Release Date</span><strong>${shoe.releaseDate || 'N/A'}</strong></div>
            <div class="spec-item"><span>Edition Type</span><strong>${shoe.editionType || 'N/A'}</strong></div>
            <div class="spec-item"><span>Condition</span><strong>${shoe.condition || 'N/A'}</strong></div>
            <div class="spec-item"><span>Archive Size</span><strong>${shoe.size || 'N/A'}</strong></div>
          </div>

          ${shoe.exhibitionNote ? `<div class="exhibition-note">${shoe.exhibitionNote}</div>` : ''}

          <div class="story-section">
            <h2>Hồ sơ lưu trữ & Câu chuyện tác phẩm</h2>
            <div class="story-content">${shoe.story}</div>
          </div>
        `;
      } else {
        container.innerHTML = '<p style="color: #777; text-align: center; padding: 50px 0;">Không tìm thấy thông tin tác phẩm này trong hệ thống lưu trữ.</p>';
      }
    } else {
      container.innerHTML = '<p style="color: #777; text-align: center; padding: 50px 0;">Lỗi tải dữ liệu kho lưu trữ.</p>';
    }
  </script>
</body>
</html>
