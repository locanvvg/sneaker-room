<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Lộc An Sneaker Collection - Sneaker Exhibition Detail"
  >

  <meta
    name="theme-color"
    content="#0d0d0d"
  >

  <title>Lộc An Sneaker Collection</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="favicon.svg"
  >

  <link
    rel="apple-touch-icon"
    href="apple-touch-icon.png"
  >
  <link
    rel="manifest"
    href="site.webmanifest"
  >

  <link
    rel="stylesheet"
    href="style.css?v=20260914-catalog-v1"
  >
</head>

<body>

  <div class="container">

    <header class="site-header">

      <div class="site-header-left">

        <a
          href="index.html"
          class="back-btn"
          id="back-link"
        >
          ← Quay lại Bộ sưu tập
        </a>

      </div>

      <a
        href="index.html"
        class="site-brand"
      >
        Lộc An Sneaker Collection
      </a>


      <div class="site-header-actions">

        <a
          href="about.html"
          class="header-about-link"
        >
          ABOUT
        </a>


        <div class="lang-switcher">

          <button
            type="button"
            id="btn-vi"
            class="lang-btn"
            onclick="changeLang('vi')"
          >
            VI
          </button>
          <button
            type="button"
            id="btn-en"
            class="lang-btn"
            onclick="changeLang('en')"
          >
            EN
          </button>

        </div>

      </div>

    </header>


    <main
      id="shoe-detail"
      class="shoe-detail-container"
    >

      <div class="shoe-image-section">

        <img
          id="shoe-image"
          src=""
          alt="Sneaker"
          decoding="async"
        >

      </div>

      <div class="shoe-info-section">

        <h2 id="shoe-title"></h2>

        <p
          id="shoe-subtitle"
          class="subtitle detail-subtitle"
        ></p>


        <div class="specs-grid">

          <div class="spec-item">
            <span
              class="spec-label"
              id="label-sku"
            >
              MÃ SẢN PHẨM
            </span>

            <span
              id="shoe-sku"
              class="spec-value"
            ></span>
          </div>

          <div class="spec-item">
            <span
              class="spec-label"
              id="label-colorway"
            >
              PHỐI MÀU
            </span>

            <span
              id="shoe-colorway"
              class="spec-value"
            ></span>
          </div>


          <div class="spec-item">
            <span
              class="spec-label"
              id="label-retail"
            >
              GIÁ PHÁT HÀNH
            </span>
            <span
              id="shoe-retail"
              class="spec-value"
            ></span>
          </div>


          <div class="spec-item">
            <span
              class="spec-label"
              id="label-date"
            >
              NGÀY RA MẮT
            </span>

            <span
              id="shoe-date"
              class="spec-value"
            ></span>
          </div>

          <div class="spec-item">
            <span
              class="spec-label"
              id="label-condition"
            >
              TÌNH TRẠNG
            </span>

            <span
              id="shoe-condition"
              class="spec-value highlight"
            ></span>
          </div>


          <div class="spec-item">
            <span
              class="spec-label"
              id="label-size"
            >
              KÍCH CỠ
            </span>
            <span
              id="shoe-size"
              class="spec-value size-highlight"
            ></span>
          </div>

        </div>

      </div>

    </main>


    <section
      class="story-section"
      id="story-section"
    >

      <h3 id="story-title">
        Câu chuyện &amp; Bối cảnh thiết kế
      </h3>

      <div id="shoe-story"></div>

    </section>


    <footer>
      <p>
        &copy; 2026 Lộc An Sneaker Collection.
        All Rights Reserved.
      </p>
    </footer>
  </div>


  <!-- BASE CATALOG -->
  <script
    src="./data.js?v=20260913-15pairs-v1"
  ></script>

  <!-- ONLY FILE YOU EDIT FOR FUTURE SHOES -->
  <script
    src="./catalog-additions.js?v=20260914-catalog-v1"
  ></script>

  <!-- LOCKED CANONICAL STORIES FOR THE 15 OWNED PAIRS -->
  <script
    src="./collection-content-final.js?v=20260917-15own-stories-v2"
  ></script>

  <!-- NORMALIZES BOTH OLD + NEW DATA -->
  <script
    src="./catalog-engine.js?v=20260914-custom2026-v21"
  ></script>

  <!-- DETAIL PAGE RENDERER -->
  <script
    src="./shoe-page.js?v=20260914-catalog-v1"
  ></script>

</body>
</html>
