<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết Sản phẩm - Lộc An Sneaker Vault</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0a0a0c; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    .container { max-width: 850px; margin: 0 auto; padding: 40px 20px; }
    .back-link { color: #888; text-decoration: none; font-size: 0.9rem; letter-spacing: 1px; display: inline-block; margin-bottom: 25px; }
    .back-link:hover { color: #fff; }
    
    /* Header tiêu đề sản phẩm */
    .shoe-header { text-align: center; margin-bottom: 30px; }
    .shoe-header h1 { font-size: 2.2rem; letter-spacing: 1.5px; margin: 0 0 10px 0; text-transform: uppercase; line-height: 1.3; }
    .shoe-header p { color: #888; font-size: 0.9rem; letter-spacing: 1.5px; margin: 0; text-transform: uppercase; }

    /* Khung hiển thị ảnh lớn phía trên với hiệu ứng xoay mượt mà chống lag tuyệt đối */
    .shoe-display-container {
      width: 100%; height: 450px; background: #141417; border: 1px solid #222; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; margin-bottom: 35px;
    }
    .shoe-image {
      max-width: 85%; max-height: 85%; object-fit: contain;
      will-change: transform; transition: transform 0.1s ease-out;
    }

    /* Bảng thông tin chi tiết */
    .specs-box {
      background: #141417; border: 1px solid #222; border-radius: 14px; padding: 25px 30px; margin-bottom: 30px;
    }
    .spec-row {
      display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #222; font-size: 0.95rem;
    }
    .spec-row:last-child { border-bottom: none; }
    .spec-label { color: #777; text-transform: uppercase; letter-spacing: 1px; font-size: 0.75rem; }
    .spec-value { color: #fff; font-weight: 500; text-align: right; }
    .spec-value.highlight { color: #ffcc00; font-weight: bold; }

    /* Ô ghi chú lưu trữ vàng (Exhibition Note) */
    .exhibition-note-box {
      background: rgba(255, 204, 0, 0.04); border-left: 4px solid #ffcc00; border: 1px solid rgba(255, 204, 0, 0.25);
      border-radius: 6px; padding: 22px; margin-bottom: 35px; font-size: 0.95rem; line-height: 1.7; color: #f0f0f0;
    }
    .exhibition-note-title {
      color: #ffcc00; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 10px; display: block;
    }

    /* Phần câu chuyện & bối cảnh thiết kế dài và cuốn hút */
    .story-section { margin-top: 40px; border-top: 1px solid #222; padding-top: 35px; }
    .story-section h2 { font-size: 1.4rem; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 25px; color: #fff; }
    .story-content { color: #ccc; line-height: 1.9; font-size: 1.05rem; }
    .story-content p { margin-bottom: 20px; text-align: justify; }

    /* Nút chuyển đổi ngôn ngữ */
    .lang-toggle {
      float: right; background: #1a1a1f; color: #ffcc00; border: 1px solid #333; padding: 8px 14px;
      border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; letter-spacing: 1px;
      transition: background 0.2s;
    }
    .lang-toggle:hover { background: #25252b; }
  </style>
</head>
<body>
  <div class="container">
    <a href="sneakers.html" class="back-link">← Quay lại danh sách Vault</a>
    <button class="lang-toggle" id="langBtn" onclick="toggleLanguage()">EN / VI</button>
    <div style="clear: both;"></div>
    
    <div id="shoeDetails">
      <!-- Nội dung render động qua JavaScript -->
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    let currentLang = 'vi';

    function getQueryParams() {
      const params = {};
      window.location.search.substring(1).split("&").forEach(item => {
        let parts = item.split("=");
        if(parts.length === 2) params[parts[0]] = decodeURIComponent(parts[1]);
      });
      return params;
    }

    function renderShoe() {
      const params = getQueryParams();
      const shoeId = params.id;
      const shoe = sneakersData.find(s => s.id === shoeId);
      const container = document.getElementById('shoeDetails');

      if (!shoe) {
        container.innerHTML = '<p style="text-align: center; color: #777; padding: 50px;">Không tìm thấy sản phẩm trong cơ sở dữ liệu lưu trữ.</p>';
        return;
      }

      const isVi = currentLang === 'vi';

      container.innerHTML = `
        <div class="shoe-header">
          <h1>${isVi ? shoe.title : shoe.titleEn}</h1>
          <p>${isVi ? shoe.subtitle : shoe.subtitleEn}</p>
        </div>

        <div class="shoe-display-container" id="displayContainer">
          <img src="${shoe.image}" alt="${shoe.title}" class="shoe-image" id="shoeImage">
        </div>

        <div class="specs-box">
          <div class="spec-row">
            <span class="spec-label">${isVi ? 'Mã sản phẩm (SKU)' : 'Product Code (SKU)'}</span>
            <span class="spec-value">${shoe.sku}</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">${isVi ? 'Phối màu (Colorway)' : 'Colorway'}</span>
            <span class="spec-value">${shoe.colorway}</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">${isVi ? 'Giá phát hành (Retail)' : 'Retail Price'}</span>
            <span class="spec-value">${isVi ? shoe.retailPrice : shoe.retailPriceEn}</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">${isVi ? 'Ngày ra mắt' : 'Release Date'}</span>
            <span class="spec-value">${shoe.releaseDate}</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">${isVi ? 'Tình trạng' : 'Condition'}</span>
            <span class="spec-value" style="color: #4cd137;">${isVi ? shoe.condition : shoe.conditionEn}</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">${isVi ? 'Kích cỡ (Size)' : 'Size'}</span>
            <span class="spec-value highlight">${shoe.size}</span>
          </div>
        </div>

        ${(shoe.exhibitionNote || shoe.exhibitionNoteEn) ? `
          <div class="exhibition-note-box">
            <span class="exhibition-note-title">${isVi ? 'Ghi chú lưu trữ (Exhibition Note):' : 'Exhibition Note:'}</span>
            ${isVi ? shoe.exhibitionNote : shoe.exhibitionNoteEn}
          </div>
        ` : ''}

        <div class="story-section">
          <h2>${isVi ? 'Câu chuyện & Bối cảnh thiết kế' : 'Story & Design Background'}</h2>
          <div class="story-content">
            ${isVi ? shoe.story : shoe.storyEn}
          </div>
        </div>
      `;

      initSmoothInteraction();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'vi' ? 'en' : 'vi';
      renderShoe();
    }

    // Tối ưu tương tác xoay mượt mà bằng requestAnimationFrame chống lag tuyệt đối
    function initSmoothInteraction() {
      const container = document.getElementById('displayContainer');
      const img = document.getElementById('shoeImage');
      if (!container || !img) return;

      let bounds = container.getBoundingClientRect();
      window.addEventListener('resize', () => { bounds = container.getBoundingClientRect(); });

      container.addEventListener('mousemove', (e) => {
        window.requestAnimationFrame(() => {
          const x = e.clientX - bounds.left;
          const y = e.clientY - bounds.top;
          const xPercent = (x / bounds.width - 0.5) * 15; 
          const yPercent = (y / bounds.height - 0.5) * -15;
          img.style.transform = `perspective(1000px) rotateY(${xPercent}deg) rotateX(${yPercent}deg) scale(1.04)`;
        });
      });

      container.addEventListener('mouseleave', () => {
        window.requestAnimationFrame(() => {
          img.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1)';
        });
      });
    }

    renderShoe();
  </script>
</body>
</html>
