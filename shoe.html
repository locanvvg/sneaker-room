<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Lộc An Sneaker Collection - Sneaker Detail"
  >

  <meta
    name="theme-color"
    content="#0d0d0d"
  >

  <title>Lộc An Sneaker Collection</title>


  <link
    rel="icon"
    type="image/svg+xml"
    href="./favicon.svg"
  >

  <link
    rel="apple-touch-icon"
    href="./apple-touch-icon.png"
  >

  <link
    rel="manifest"
    href="./site.webmanifest"
  >

  <link
    rel="stylesheet"
    href="./style.css?v=20260912-13"
  >

</head>


<body>

  <div class="container">


    <header class="site-header">


      <div class="site-header-left">

        <a
          href="./index.html"
          class="back-btn"
          id="back-link"
        >
          ← Quay lại Bộ sưu tập
        </a>

      </div>


      <a
        href="./index.html"
        class="site-brand"
      >
        Lộc An Sneaker Collection
      </a>


      <div class="site-header-actions">

        <a
          href="./about.html"
          class="header-about-link"
        >
          ABOUT
        </a>


        <div class="lang-switcher">

          <button
            type="button"
            id="btn-vi"
            class="lang-btn"
            onclick="changeLang('vi')"
          >
            VI
          </button>

          <button
            type="button"
            id="btn-en"
            class="lang-btn"
            onclick="changeLang('en')"
          >
            EN
          </button>

        </div>

      </div>


    </header>


    <main
      id="shoe-detail"
      class="shoe-detail-container"
    >


      <div class="shoe-image-section">

        <img
          id="shoe-image"
          src=""
          alt=""
          decoding="async"
        >

      </div>


      <div class="shoe-info-section">

        <h2 id="shoe-title"></h2>

        <p
          id="shoe-subtitle"
          class="subtitle detail-subtitle"
        ></p>


        <div class="specs-grid">


          <div class="spec-item">

            <span
              class="spec-label"
              id="label-sku"
            >
              MÃ SẢN PHẨM
            </span>

            <span
              class="spec-value"
              id="shoe-sku"
            ></span>

          </div>


          <div class="spec-item">

            <span
              class="spec-label"
              id="label-colorway"
            >
              PHỐI MÀU
            </span>

            <span
              class="spec-value"
              id="shoe-colorway"
            ></span>

          </div>


          <div class="spec-item">

            <span
              class="spec-label"
              id="label-retail"
            >
              GIÁ PHÁT HÀNH
            </span>

            <span
              class="spec-value"
              id="shoe-retail"
            ></span>

          </div>


          <div class="spec-item">

            <span
              class="spec-label"
              id="label-date"
            >
              NGÀY RA MẮT
            </span>

            <span
              class="spec-value"
              id="shoe-date"
            ></span>

          </div>


          <div class="spec-item">

            <span
              class="spec-label"
              id="label-condition"
            >
              TÌNH TRẠNG
            </span>

            <span
              class="spec-value condition-value"
              id="shoe-condition"
            ></span>

          </div>


          <div class="spec-item">

            <span
              class="spec-label"
              id="label-size"
            >
              KÍCH CỠ
            </span>

            <span
              class="spec-value size-highlight"
              id="shoe-size"
            ></span>

          </div>


        </div>

      </div>

    </main>


    <section
      id="story-section"
      class="story-section"
    >

      <h3 id="story-title">
        Câu chuyện &amp; Bối cảnh thiết kế
      </h3>

      <div id="shoe-story"></div>

    </section>


    <footer>

      <p>
        &copy; 2026 Lộc An Sneaker Collection.
        All Rights Reserved.
      </p>

    </footer>


  </div>


  <!-- IMPORTANT: DATA.JS MUST LOAD BEFORE DETAIL SCRIPT -->

  <script src="./data.js?v=20260912-13"></script>


  <script>

    const supportedLanguages = [
      "vi",
      "en"
    ];


    function normalizeLanguage(lang) {

      return supportedLanguages.includes(lang)
        ? lang
        : "vi";
    }


    const params =
      new URLSearchParams(
        window.location.search
      );


    const shoeId =
      params.get("id");


    let currentLang =
      normalizeLanguage(
        params.get("lang") ||
        localStorage.getItem("locan_lang") ||
        "vi"
      );


    const labels = {

      vi: {

        back:
          "← Quay lại Bộ sưu tập",

        sku:
          "MÃ SẢN PHẨM",

        colorway:
          "PHỐI MÀU",

        retail:
          "GIÁ PHÁT HÀNH",

        date:
          "NGÀY RA MẮT",

        condition:
          "TÌNH TRẠNG",

        size:
          "KÍCH CỠ",

        story:
          "Câu chuyện & Bối cảnh thiết kế",

        notFound:
          "Không tìm thấy thông tin đôi giày này."
      },


      en: {

        back:
          "← Back to Collection",

        sku:
          "SKU",

        colorway:
          "COLORWAY",

        retail:
          "RETAIL PRICE",

        date:
          "RELEASE DATE",

        condition:
          "CONDITION",

        size:
          "SIZE",

        story:
          "Story & Design Background",

        notFound:
          "Sneaker information not found."
      }

    };


    function localized(value) {

      if (!value) {
        return "";
      }


      if (
        typeof value === "string"
      ) {

        return value;
      }


      return (
        value[currentLang] ||
        value.en ||
        value.vi ||
        ""
      );
    }


    function formatDate(value) {

      if (!value) {
        return "N/A";
      }


      if (
        /^\d{4}-\d{2}-\d{2}$/.test(value)
      ) {

        const [
          year,
          month,
          day
        ] =
          value
            .split("-")
            .map(Number);


        const date =
          new Date(
            Date.UTC(
              year,
              month - 1,
              day
            )
          );


        return date.toLocaleDateString(
          currentLang === "vi"
            ? "vi-VN"
            : "en-US",
          {
            year: "numeric",
            month: "long",
            day: "numeric",
            timeZone: "UTC"
          }
        );
      }


      if (
        /^\d{4}-\d{2}$/.test(value)
      ) {

        const [
          year,
          month
        ] =
          value
            .split("-")
            .map(Number);


        const date =
          new Date(
            Date.UTC(
              year,
              month - 1,
              1
            )
          );


        return date.toLocaleDateString(
          currentLang === "vi"
            ? "vi-VN"
            : "en-US",
          {
            year: "numeric",
            month: "long",
            timeZone: "UTC"
          }
        );
      }


      return value;
    }


    function updateConditionColor(
      condition
    ) {

      const element =
        document.getElementById(
          "shoe-condition"
        );


      element.classList.remove(
        "condition-deadstock",
        "condition-used"
      );


      const normalized =
        String(condition)
          .trim()
          .toLowerCase();


      if (
        normalized === "deadstock"
      ) {

        element.classList.add(
          "condition-deadstock"
        );
      }


      if (
        normalized === "used"
      ) {

        element.classList.add(
          "condition-used"
        );
      }
    }


    function updateLanguageInterface() {

      const language =
        labels[currentLang];


      document.documentElement.lang =
        currentLang;


      document
        .getElementById("btn-vi")
        .classList.toggle(
          "active",
          currentLang === "vi"
        );


      document
        .getElementById("btn-en")
        .classList.toggle(
          "active",
          currentLang === "en"
        );


      const back =
        document.getElementById(
          "back-link"
        );


      back.textContent =
        language.back;


      back.href =
        `./index.html?lang=${encodeURIComponent(currentLang)}`;


      document
        .getElementById("label-sku")
        .textContent =
        language.sku;


      document
        .getElementById("label-colorway")
        .textContent =
        language.colorway;


      document
        .getElementById("label-retail")
        .textContent =
        language.retail;


      document
        .getElementById("label-date")
        .textContent =
        language.date;


      document
        .getElementById("label-condition")
        .textContent =
        language.condition;


      document
        .getElementById("label-size")
        .textContent =
        language.size;


      document
        .getElementById("story-title")
        .textContent =
        language.story;
    }


    function changeLang(lang) {

      currentLang =
        normalizeLanguage(lang);


      localStorage.setItem(
        "locan_lang",
        currentLang
      );


      const url =
        new URL(
          window.location.href
        );


      url.searchParams.set(
        "lang",
        currentLang
      );


      window.history.replaceState(
        {},
        "",
        url.pathname +
        url.search +
        url.hash
      );


      loadShoe();
    }


    function showNotFound() {

      const message =
        labels[currentLang]
          .notFound;


      document.title =
        message;


      document
        .getElementById(
          "shoe-detail"
        )
        .innerHTML = `
          <div class="not-found">
            <p>${message}</p>

            <a
              href="./index.html"
              class="primary-action"
            >
              COLLECTION
            </a>
          </div>
        `;


      document
        .getElementById(
          "story-section"
        )
        .style.display =
        "none";
    }


    function loadShoe() {

      updateLanguageInterface();


      /*
         Check data.js successfully loaded
      */

      if (
        typeof sneakers === "undefined" ||
        !Array.isArray(sneakers)
      ) {

        console.error(
          "data.js was not loaded correctly."
        );

        showNotFound();

        return;
      }


      /*
         Check URL contains ?id=
      */

      if (!shoeId) {

        console.error(
          "No sneaker ID found in URL."
        );

        showNotFound();

        return;
      }


      /*
         Find sneaker
      */

      const sneaker =
        sneakers.find(
          item =>
            String(item.id) ===
            String(shoeId)
        );


      if (!sneaker) {

        console.error(
          "Sneaker ID not found:",
          shoeId
        );

        showNotFound();

        return;
      }


      document
        .getElementById(
          "story-section"
        )
        .style.display =
        "block";


      const title =
        localized(
          sneaker.title
        );


      const subtitle =
        localized(
          sneaker.subtitle
        );


      const condition =
        localized(
          sneaker.condition
        ) || "N/A";


      document.title =
        `${title} | Lộc An Sneaker Collection`;


      document
        .getElementById(
          "shoe-title"
        )
        .textContent =
        title;


      document
        .getElementById(
          "shoe-subtitle"
        )
        .textContent =
        subtitle;


      document
        .getElementById(
          "shoe-sku"
        )
        .textContent =
        sneaker.sku ||
        "N/A";


      document
        .getElementById(
          "shoe-colorway"
        )
        .textContent =
        sneaker.colorway ||
        "N/A";


      document
        .getElementById(
          "shoe-retail"
        )
        .textContent =
        sneaker.retailPrice ||
        "N/A";


      document
        .getElementById(
          "shoe-date"
        )
        .textContent =
        formatDate(
          sneaker.releaseDate
        );


      document
        .getElementById(
          "shoe-condition"
        )
        .textContent =
        condition;


      updateConditionColor(
        condition
      );


      document
        .getElementById(
          "shoe-size"
        )
        .textContent =
        sneaker.size ||
        "N/A";


      const image =
        document.getElementById(
          "shoe-image"
        );


      image.src =
        sneaker.image ||
        "";


      image.alt =
        title;


      document
        .getElementById(
          "shoe-story"
        )
        .innerHTML =
        localized(
          sneaker.story
        );
    }


    document.addEventListener(
      "DOMContentLoaded",
      loadShoe
    );

  </script>

</body>

</html>
