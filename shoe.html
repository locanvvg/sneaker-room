<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Tác Phẩm - Lộc An Sneaker Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a href="index.html" class="back-btn" id="back-link">← Quay lại Bộ sưu tập</a>
      <h1>Lộc An Sneaker Collection</h1>
      <div class="lang-switcher">
        <button onclick="changeLang('vi')" id="btn-vi" class="lang-btn active">VI</button>
        <button onclick="changeLang('en')" id="btn-en" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="shoe-detail-container">
      <div class="shoe-image-section">
        <img id="shoe-image" src="" alt="Sneaker Image">
      </div>

      <div class="shoe-info-section">
        <h2 id="shoe-title"></h2>
        <p id="shoe-subtitle" class="subtitle"></p>

        <div class="specs-grid">
          <div class="spec-item">
            <span class="spec-label" data-i18n="skuLabel">MÃ SẢN PHẨM (SKU)</span>
            <span id="shoe-sku" class="spec-value"></span>
          </div>
          <div class="spec-item">
            <span class="spec-label" data-i18n="colorwayLabel">PHỐI MÀU (COLORWAY)</span>
            <span id="shoe-colorway" class="spec-value"></span>
          </div>
          <div class="spec-item">
            <span class="spec-label" data-i18n="retailLabel">GIÁ PHÁT HÀNH (RETAIL)</span>
            <span id="shoe-retail" class="spec-value"></span>
          </div>
          <div class="spec-item">
            <span class="spec-label" data-i18n="dateLabel">NGÀY RA MẮT</span>
            <span id="shoe-date" class="spec-value"></span>
          </div>
          <div class="spec-item">
            <span class="spec-label" data-i18n="conditionLabel">TÌNH TRẠNG</span>
            <span id="shoe-condition" class="spec-value highlight"></span>
          </div>
          <div class="spec-item">
            <span class="spec-label" data-i18n="sizeLabel">KÍCH CỠ (SIZE)</span>
            <span id="shoe-size" class="spec-value size-highlight"></span>
          </div>
        </div>
      </div>
    </main>

    <section class="story-section">
      <h3 data-i18n="storyTitle">Câu chuyện & Bối cảnh thiết kế</h3>
      <div id="shoe-story"></div>
    </section>

    <footer>
      <p>&copy; 2026 Lộc An Sneaker Collection. All Rights Reserved.</p>
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="main.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const shoeId = urlParams.get('id');
    if (urlParams.has('lang')) {
      currentLang = urlParams.get('lang');
      localStorage.setItem('locan_lang', currentLang);
    }

    const labels = {
      vi: {
        back: "← Quay lại Bộ sưu tập",
        skuLabel: "MÃ SẢN PHẨM (SKU)",
        colorwayLabel: "PHỐI MÀU (COLORWAY)",
        retailLabel: "GIÁ PHÁT HÀNH (RETAIL)",
        dateLabel: "NGÀY RA MẮT",
        conditionLabel: "TÌNH TRẠNG",
        sizeLabel: "KÍCH CỠ (SIZE)",
        storyTitle: "Câu chuyện & Bối cảnh thiết kế",
        notFound: "Không tìm thấy thông tin tác phẩm này."
      },
      en: {
        back: "← Back to Collection",
        skuLabel: "SKU",
        colorwayLabel: "COLORWAY",
        retailLabel: "RETAIL PRICE",
        dateLabel: "RELEASE DATE",
        conditionLabel: "CONDITION",
        sizeLabel: "SIZE",
        storyTitle: "Story & Design Background",
        notFound: "Piece information not found."
      }
    };

    function changeLang(lang) {
      currentLang = lang;
      localStorage.setItem('locan_lang', lang);
      window.history.replaceState({}, '', `shoe.html?id=${shoeId}&lang=${lang}`);
      loadShoeDetails();
    }

    function loadShoeDetails() {
      const btnVi = document.getElementById('btn-vi');
      const btnEn = document.getElementById('btn-en');
      if (btnVi) btnVi.classList.toggle('active', currentLang === 'vi');
      if (btnEn) btnEn.classList.toggle('active', currentLang === 'en');
      
      const backLink = document.getElementById('back-link');
      if (backLink) backLink.innerText = labels[currentLang].back;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (labels[currentLang][key]) el.innerText = labels[currentLang][key];
      });

      const sneaker = sneakers.find(item => item.id === shoeId);

      if (sneaker) {
        document.getElementById('shoe-title').innerText = sneaker.title[currentLang];
        document.getElementById('shoe-subtitle').innerText = sneaker.subtitle[currentLang];
        document.getElementById('shoe-sku').innerText = sneaker.sku;
        document.getElementById('shoe-colorway').innerText = sneaker.colorway;
        document.getElementById('shoe-retail').innerText = sneaker.retailPrice;
        document.getElementById('shoe-date').innerText = sneaker.releaseDate;
        document.getElementById('shoe-condition').innerText = sneaker.condition[currentLang];
        document.getElementById('shoe-size').innerText = sneaker.size;
        
        const imgEl = document.getElementById('shoe-image');
        imgEl.src = sneaker.image;
        imgEl.alt = sneaker.title[currentLang];
        
        document.getElementById('shoe-story').innerHTML = sneaker.story[currentLang];
      } else {
        document.querySelector('main').innerHTML = `<p style="text-align:center; width:100%; grid-column: 1 / -1; padding: 50px;">${labels[currentLang].notFound}</p>`;
      }
    }

    loadShoeDetails();
  </script>
</body>
</html>
