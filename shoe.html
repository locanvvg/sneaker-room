<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Tác Phẩm - Lộc An Sneaker Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="back-btn" id="btn-back">← Quay lại Bộ sưu tập</a>
    <h1>Lộc An Sneaker Collection</h1>
    <div class="lang-switcher">
      <button onclick="setLanguage('vi')" id="lang-vi-btn" class="active">VI</button>
      <span>/</span>
      <button onclick="setLanguage('en')" id="lang-en-btn">EN</button>
    </div>
  </header>

  <main class="shoe-detail-container">
    <div class="shoe-image-section">
      <img id="shoe-image" src="" alt="Sneaker Image">
    </div>

    <div class="shoe-info-section">
      <h2 id="shoe-title"></h2>
      <p id="shoe-subtitle" class="subtitle"></p>

      <div class="specs-grid">
        <div class="spec-item">
          <span class="spec-label" data-vi="MÃ SẢN PHẨM (SKU)" data-en="SKU">MÃ SẢN PHẨM (SKU)</span>
          <span id="shoe-sku" class="spec-value"></span>
        </div>
        <div class="spec-item">
          <span class="spec-label" data-vi="PHỐI MÀU (COLORWAY)" data-en="COLORWAY">PHỐI MÀU (COLORWAY)</span>
          <span id="shoe-colorway" class="spec-value"></span>
        </div>
        <div class="spec-item">
          <span class="spec-label" data-vi="GIÁ PHÁT HÀNH (RETAIL)" data-en="RETAIL PRICE">GIÁ PHÁT HÀNH (RETAIL)</span>
          <span id="shoe-retail" class="spec-value"></span>
        </div>
        <div class="spec-item">
          <span class="spec-label" data-vi="NGÀY RA MẮT" data-en="RELEASE DATE">NGÀY RA MẮT</span>
          <span id="shoe-date" class="spec-value"></span>
        </div>
        <div class="spec-item">
          <span class="spec-label" data-vi="TÌNH TRẠNG" data-en="CONDITION">TÌNH TRẠNG</span>
          <span id="shoe-condition" class="spec-value highlight"></span>
        </div>
        <div class="spec-item">
          <span class="spec-label" data-vi="KÍCH CỠ (SIZE)" data-en="SIZE">KÍCH CỠ (SIZE)</span>
          <span id="shoe-size" class="spec-value size-highlight"></span>
        </div>
      </div>

      <!-- Khung ghi chú lưu trữ màu vàng (Đã chuyển lên sát cạnh phần tình trạng) -->
      <div id="exhibition-note-box" class="exhibition-note-card" style="display: none;">
        <h3 data-vi="Ghi chú lưu trữ (Exhibition Note)" data-en="Exhibition Note">Ghi chú lưu trữ (Exhibition Note)</h3>
        <p id="shoe-exhibition-note"></p>
      </div>
    </div>
  </main>

  <section class="story-section">
    <h3 data-vi="Câu chuyện & Bối cảnh thiết kế" data-en="Story & Design Context">Câu chuyện & Bối cảnh thiết kế</h3>
    <div id="shoe-story"></div>
  </section>

  <script src="data.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const shoeId = urlParams.get('id');
    const sneaker = sneakers.find(item => item.id === shoeId);

    let currentLang = localStorage.getItem('locan_sneaker_lang') || 'vi';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('locan_sneaker_lang', lang);
      
      document.getElementById('lang-vi-btn').classList.toggle('active', lang === 'vi');
      document.getElementById('lang-en-btn').classList.toggle('active', lang === 'en');

      document.querySelectorAll('[data-vi]').forEach(el => {
        el.innerText = el.getAttribute(`data-${lang}`);
      });

      if (sneaker) {
        renderSneakerDetails();
      }
    }

    function renderSneakerDetails() {
      if (!sneaker) return;
      document.getElementById('shoe-title').innerText = currentLang === 'en' ? sneaker.titleEn : sneaker.title;
      document.getElementById('shoe-subtitle').innerText = currentLang === 'en' ? sneaker.subtitleEn : sneaker.subtitle;
      document.getElementById('shoe-sku').innerText = sneaker.sku;
      document.getElementById('shoe-colorway').innerText = sneaker.colorway;
      document.getElementById('shoe-retail').innerText = sneaker.retailPrice;
      document.getElementById('shoe-date').innerText = sneaker.releaseDate;
      document.getElementById('shoe-condition').innerText = currentLang === 'en' ? sneaker.conditionEn : sneaker.condition;
      document.getElementById('shoe-size').innerText = sneaker.size;
      document.getElementById('shoe-image').src = sneaker.image;
      document.getElementById('shoe-image').alt = sneaker.title;
      document.getElementById('shoe-story').innerHTML = currentLang === 'en' ? sneaker.storyEn : sneaker.story;

      const noteBox = document.getElementById('exhibition-note-box');
      const noteElement = document.getElementById('shoe-exhibition-note');
      const noteText = currentLang === 'en' ? sneaker.exhibitionNoteEn : sneaker.exhibitionNote;

      if (noteText) {
        noteElement.innerText = noteText;
        noteBox.style.display = 'block';
      } else {
        noteBox.style.display = 'none';
      }
    }

    if (sneaker) {
      renderSneakerDetails();
      setLanguage(currentLang);
    } else {
      document.querySelector('main').innerHTML = '<p style="text-align:center; width:100%; grid-column: 1 / -1; padding: 50px;">Không tìm thấy thông tin tác phẩm này / Item not found.</p>';
    }
  </script>

</body>
</html>
